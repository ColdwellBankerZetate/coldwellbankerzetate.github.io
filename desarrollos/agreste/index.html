<style>
/* Desarrollo = presentación del proyecto: plano (KMZ) sobre el satélite, ubicación, amenities, ventajas, lotes y brochure.
   Compu: panel a la izquierda que se lee de arriba a abajo. Celular: mapa con el plano + hoja que se sube. */
:root{
  --ink:#0a0a0a; --panel:#101010; --raise:#181818; --glass:rgba(12,12,12,.72);
  --line:rgba(255,255,255,.09); --line-2:rgba(255,255,255,.18);
  --fg:#f3f1ec; --muted:#9b978f; --dim:#6d6a64; --champ:#c8b28a; --venta:#e3141e;
  --f-display:"Bodoni Moda","Didot","Bodoni 72",Georgia,serif;
  --f-body:"Hanken Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--ink);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
a{color:inherit}
.app{display:grid;grid-template-columns:clamp(400px,36vw,560px) 1fr;height:100%}
.panel{background:var(--panel);border-right:1px solid var(--line);overflow:auto;min-height:0;scrollbar-width:thin;scrollbar-color:var(--line-2) transparent}
.pad{padding-left:max(30px,env(safe-area-inset-left,0px));padding-right:30px}
.barra-sup{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-top:18px;font-size:11px;letter-spacing:.14em;text-transform:uppercase}
.volver{color:var(--muted);text-decoration:none;font-weight:600}
.volver:hover{color:var(--fg)}
.idiomas{display:flex;gap:2px}
.idiomas button{background:none;border:0;padding:4px 6px;font-size:11px;font-weight:600;letter-spacing:.14em;color:var(--dim);cursor:pointer}
.idiomas button[aria-pressed="true"]{color:var(--fg);text-decoration:underline;text-decoration-color:var(--venta);text-underline-offset:5px;text-decoration-thickness:2px}
.logo-wrap{display:flex;justify-content:center;padding-block:14px 20px;border-bottom:1px solid var(--line)}
.logo{display:block;height:44px;width:auto}

.portada{display:grid;gap:12px;padding-top:24px}
.kicker{display:inline-flex;align-items:center;gap:8px;font-size:11px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:var(--champ)}
h1{font-family:var(--f-display);font-style:italic;font-weight:500;font-size:50px;line-height:1;letter-spacing:-.01em;margin:0;text-wrap:balance}
.estado{display:inline-flex;align-items:center;border:1px solid rgba(200,178,138,.45);color:var(--champ);border-radius:999px;padding:3px 11px;font-size:10.5px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;width:max-content}
.galeria{position:relative;border-radius:6px;overflow:hidden;background:var(--raise);margin-top:6px}
.galeria .pista{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.galeria .pista::-webkit-scrollbar{display:none}
.galeria img{flex:0 0 100%;width:100%;aspect-ratio:3/2;object-fit:cover;scroll-snap-align:start;display:block}
.galeria .flecha{position:absolute;top:50%;transform:translateY(-50%);width:34px;height:34px;border-radius:50%;border:1px solid rgba(255,255,255,.25);background:rgba(10,10,10,.6);color:#fff;display:grid;place-items:center;cursor:pointer;font-size:16px;line-height:1;padding:0}
.galeria .ant{left:10px}.galeria .sig{right:10px}
.galeria .cont{position:absolute;right:10px;bottom:10px;background:rgba(10,10,10,.65);color:#fff;font-size:11px;font-weight:600;padding:3px 8px;border-radius:999px;font-variant-numeric:tabular-nums}
.cifras.par{grid-template-columns:1fr 1fr}
.cifras{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-top:6px}
.cifra{background:var(--panel);padding:14px 14px 12px;display:grid;gap:2px}
.cifra b{font-family:var(--f-display);font-size:28px;font-weight:500;line-height:1;font-variant-numeric:lining-nums}
.cifra span{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim)}
.acciones{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:4px}
.b-pri,.b-sec{display:flex;align-items:center;justify-content:center;gap:8px;border-radius:999px;padding:12px 14px;font-size:11.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;text-decoration:none;cursor:pointer;white-space:nowrap}
.b-pri{background:var(--champ);color:var(--ink);border:0}
.b-sec{background:transparent;color:var(--fg);border:1px solid var(--line-2)}
.b-sec:hover{border-color:var(--fg)}
.b-pri:hover{filter:brightness(1.07)}
.acciones .ancho{grid-column:1/-1}

.sec{padding-block:26px 4px;display:grid;gap:12px}
.sec+.sec{border-top:1px solid var(--line);margin-top:22px}
.sec h2{margin:0;font-size:11px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:var(--champ)}
.sec .t{font-family:var(--f-display);font-style:italic;font-weight:500;font-size:28px;line-height:1.05;margin:-4px 0 0}
.texto{margin:0;color:#cfcbc3;font-size:14.5px;white-space:pre-line}
.texto.corto{display:-webkit-box;-webkit-line-clamp:6;-webkit-box-orient:vertical;overflow:hidden}
.mas{background:none;border:0;padding:0;font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--champ);cursor:pointer;justify-self:start}
.cerca{list-style:none;margin:0;padding:0;display:grid}
.cerca li{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.cerca li b{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.nota{font-size:11px;color:var(--dim)}
.amen{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:10px 16px}
.amen li{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;line-height:1.35}
.amen li::before{content:"";flex:none;width:7px;height:7px;margin-top:6px;background:var(--champ);transform:rotate(45deg)}
.ventajas{list-style:none;margin:0;padding:0;display:grid;gap:12px;counter-reset:v}
.ventajas li{display:grid;grid-template-columns:30px 1fr;gap:10px;font-size:14px;line-height:1.4;counter-increment:v}
.ventajas li::before{content:counter(v,decimal-leading-zero);font-family:var(--f-display);font-style:italic;color:var(--champ);font-size:18px;line-height:1.1}
.con-visor .logo-wrap{padding-block:10px 12px}
.con-visor .logo{height:34px}
.con-visor .portada{padding-top:16px;gap:10px}
.con-visor h1{font-size:38px}
.visor{display:grid;gap:10px;padding-block:18px 8px}
.visor-bar{display:flex;align-items:center;justify-content:space-between;gap:10px}
.visor-bar h2{margin:0;font-size:11px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:var(--champ)}
.visor-bar .chips{display:flex;gap:6px}
.visor-bar .chips button{background:none;border:1px solid var(--line-2);border-radius:999px;padding:3px 10px;font-size:10.5px;font-weight:700;letter-spacing:.14em;color:var(--muted);cursor:pointer}
.visor-bar .chips button[aria-pressed="true"]{background:var(--fg);color:var(--ink);border-color:var(--fg)}
.paginas{display:grid;gap:10px}
.pag{position:relative;background:var(--raise);border-radius:4px;overflow:hidden;box-shadow:0 2px 14px rgba(0,0,0,.5)}
.pag canvas{display:block;width:100%;height:100%}
.visor-msg{padding:28px 0;text-align:center;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.visor-msg a{color:var(--champ)}
.pie{padding-block:24px calc(24px + env(safe-area-inset-bottom,0px));font-size:11px;color:var(--dim)}

/* mapa */
.mapa-wrap{position:relative;min-width:0;min-height:0;overflow:hidden}
#mapa{position:absolute;inset:0;background:#0c0f0c;z-index:0;isolation:isolate}
.mapa-wrap::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:450;background:radial-gradient(120% 90% at 50% 45%,transparent 60%,rgba(0,0,0,.4) 100%)}
.leaflet-tile-pane{filter:brightness(.8) contrast(1.08) saturate(.85)}
.leaflet-container{font-family:var(--f-body);background:#0c0f0c}
.leaflet-control-attribution{background:rgba(0,0,0,.55)!important;color:#8d8a84!important;font-size:10px}
.leaflet-control-attribution a{color:#b8b4ac!important}
.leaflet-bar{border:1px solid var(--line-2)!important;box-shadow:none!important;border-radius:999px!important;overflow:hidden}
.leaflet-bar a{background:var(--glass)!important;color:var(--fg)!important;border-bottom:1px solid var(--line)!important;width:36px!important;height:36px!important;line-height:36px!important}
.leaflet-bar a:last-child{border-bottom:0!important}
#mp{position:absolute;inset:0;z-index:1;isolation:isolate;background:#0c0c0c}
#mp .leaflet-control-attribution{display:none}
.ayuda-mp{position:absolute;z-index:600;left:50%;transform:translateX(-50%);bottom:18px;background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);color:var(--fg);font-size:10.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;padding:8px 14px;border-radius:999px;white-space:nowrap;pointer-events:none;transition:opacity .4s}
.ayuda-mp.fuera{opacity:0}
.en-mp::after{display:none}
.vista{position:absolute;z-index:600;top:16px;right:16px;display:flex;gap:2px;background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line-2);border-radius:999px;padding:3px}
.vista button{background:none;border:0;border-radius:999px;padding:7px 14px;font-size:10.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);cursor:pointer}
.vista button[aria-pressed="true"]{background:var(--fg);color:var(--ink)}
.ico{background:none;border:0}
.dev-pin{position:absolute;left:0;top:0;transform:translate(-21px,-21px);display:flex;align-items:center;gap:10px;white-space:nowrap;pointer-events:none}
.dev-pin .ic{width:42px;height:42px;flex:none;display:grid;place-items:center;background:var(--champ);color:#0a0a0a;border-radius:10px;transform:rotate(45deg);box-shadow:0 0 0 2px rgba(255,255,255,.9),0 0 0 8px rgba(200,178,138,.28),0 6px 16px rgba(0,0,0,.55)}
.dev-pin .ic svg{transform:rotate(-45deg);width:20px;height:20px}
.dev-pin .n{font-family:var(--f-display);font-style:italic;font-size:20px;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.9),0 0 12px rgba(0,0,0,.8)}
.lugar{position:absolute;left:0;top:0;transform:translate(-5px,-5px);display:flex;align-items:center;gap:7px;white-space:nowrap;pointer-events:none}
.lugar i{width:9px;height:9px;background:#fff;transform:rotate(45deg);box-shadow:0 0 0 2px rgba(10,10,10,.85);flex:none}
.lugar span{font-size:10.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.95),0 0 10px rgba(0,0,0,.8)}
.lugar b{font-weight:600;color:var(--champ)}
.amen-pin{position:absolute;left:0;top:0;transform:translate(-6px,-6px);display:flex;align-items:center;gap:7px;white-space:nowrap;pointer-events:none}
.amen-pin i{width:11px;height:11px;background:var(--champ);transform:rotate(45deg);box-shadow:0 0 0 2px rgba(10,10,10,.85),0 2px 6px rgba(0,0,0,.5);flex:none}
.amen-pin span{font-size:10.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.95),0 0 10px rgba(0,0,0,.8)}
.n-lote{font-size:10px;font-weight:700;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.95);transform:translate(-50%,-50%);position:absolute;white-space:nowrap;pointer-events:none}
.sin-num .n-lote{display:none}
.n-mz{font-size:12px;font-weight:700;letter-spacing:.06em;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,1),0 0 6px rgba(0,0,0,.8);transform:translate(-50%,-50%);position:absolute;white-space:nowrap;pointer-events:none;display:none}
.sin-num .n-mz{display:block}
.n-lote.vendido{color:rgba(255,255,255,.45);text-decoration:line-through}
.n-lote.reservado{color:var(--champ)}
.br-idiomas{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:2px;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.br-idiomas span{margin-right:2px}
.br-idiomas a{border:1px solid var(--line-2);border-radius:999px;padding:3px 9px;font-weight:700;color:var(--fg);text-decoration:none}
.br-idiomas a:hover{border-color:var(--fg)}
.pie .interno{display:inline-flex;align-items:center;gap:5px;margin-left:12px;color:var(--dim);text-decoration:none;letter-spacing:.06em}
.pie .interno:hover{color:var(--muted)}
.leaflet-tooltip.tt{background:#0d0d0d;color:var(--fg);border:1px solid var(--line-2);border-radius:8px;padding:8px 11px;box-shadow:0 10px 30px rgba(0,0,0,.55);font-family:var(--f-body);font-size:12.5px;line-height:1.35}
.leaflet-tooltip.tt::before{display:none}
.tt b{display:block;font-family:var(--f-display);font-size:18px;font-weight:500}
.tt span{color:var(--muted)}

.top,.hoja{display:none}
@media (max-width:899px){
  .app{display:block;height:100%}
  .panel{display:none}
  .mapa-wrap{position:fixed;inset:0}
  .leaflet-control-zoom{display:none}
  .top{display:flex;flex-direction:column;align-items:center;position:absolute;z-index:600;left:0;right:0;top:0;padding-top:calc(14px + env(safe-area-inset-top,0px));padding-inline:16px;pointer-events:none;text-shadow:0 1px 2px rgba(0,0,0,.85),0 0 18px rgba(0,0,0,.6)}
  .top .esquinas{position:absolute;left:10px;right:10px;top:calc(8px + env(safe-area-inset-top,0px));display:flex;justify-content:space-between;align-items:center;pointer-events:auto}
  .top .esquinas .volver{font-size:18px;padding:6px 8px;color:#fff;line-height:1}
  .top .idiomas button{color:rgba(255,255,255,.6);font-size:10px;padding:6px 4px}

  .top .kicker{margin-top:44px;font-size:9.5px;letter-spacing:.2em;text-align:center}
  .top h2{font-family:var(--f-display);font-style:italic;font-weight:500;font-size:32px;line-height:1;margin:4px 0 0;color:#fff;text-align:center;text-wrap:balance;max-width:86%}
  .top .raya{display:block;width:72px;height:1px;margin:12px 0 0;background:var(--champ)}
  .vista{top:auto;right:auto;left:50%;transform:translateX(-50%);bottom:calc(var(--hoja-min) + 14px + env(safe-area-inset-bottom,0px))}
  :root{--hoja-min:64px}
  .leaflet-bottom{bottom:calc(var(--hoja-min) + env(safe-area-inset-bottom,0px))}
  .ayuda-mp{bottom:auto;top:calc(138px + env(safe-area-inset-top,0px))}
  .hoja{display:block;position:absolute;z-index:700;left:0;right:0;bottom:0;height:calc(100% - 50px - env(safe-area-inset-top,0px));background:rgba(12,12,12,.97);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line-2);border-radius:18px 18px 0 0;box-shadow:0 -20px 50px rgba(0,0,0,.55);transform:translateY(calc(100% - var(--hoja-min) - env(safe-area-inset-bottom,0px)));transition:transform .35s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column}
  .hoja.abierta{transform:none}
  .hoja .asa{flex:none;display:grid;gap:10px;padding:10px 16px 14px;cursor:pointer;touch-action:none}
  .hoja .asa::before{content:"";justify-self:center;width:40px;height:4px;border-radius:2px;background:rgba(255,255,255,.3)}
  .hoja .resumen{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
  .hoja .resumen b{font-family:var(--f-display);font-style:italic;font-weight:500;font-size:22px;white-space:nowrap}
  .hoja .resumen span{font-size:10.5px;color:var(--champ);font-weight:600;letter-spacing:.12em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
  .hoja .acciones{margin:0}
  .hoja .cuerpo{overflow:auto;flex:1;padding:0 16px calc(24px + env(safe-area-inset-bottom,0px));overscroll-behavior:contain}
  .hoja .pad{padding-inline:0}
  .hoja.con-visor .asa{padding-bottom:6px}
  .hoja.con-visor .cuerpo{padding:0 6px 8px}
  .hoja.con-visor .visor{padding-block:2px 0}
  .visor .fin{padding:14px 6px calc(18px + env(safe-area-inset-bottom,0px))}
  .en-mp .top .kicker,.en-mp .top h2,.en-mp .top .raya{display:none}
  .en-mp .hoja{display:none}
  .en-mp .vista{bottom:calc(14px + env(safe-area-inset-bottom,0px))}
  .en-mp .ayuda-mp{top:calc(54px + env(safe-area-inset-top,0px))}
  .hoja h1{display:none}
  .hoja .portada{padding-top:4px}
  .amen{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

    if (x.r) {
      const dias = []; for (const d = new Date(x.r[0]); d <= x.r[1]; d.setDate(d.getDate() + 1)) { const k = iso(d); if (k >= A.hoy) dias.push(k); }
      const libres = dias.filter(k => !A.occ.has(k));
      if (libres.length === dias.length) { estado = t("disponible"); cls = "li"; }
      else if (!libres.length) { estado = t("ocupado"); cls = "oc"; }
      else { estado = `${t("libre_dias")} ${rangosFechas(libres)}`; cls = "pa"; }
    }
    return x.periodo ? `<tr class="${cls}"><td>${esc(periodo(x.periodo))}</td><td>${mon(x.moneda)} ${fmt(x.precio)}</td><td>${esc(estado)}</td></tr>` : "";
  }).join("");
  caja.querySelector(".per").innerHTML = filas ? `<table class="tabla-disp">${filas}</table>` : "";
  const cal = caja.querySelector(".cal");
  if (cal._k == null) { const i = A.meses.findIndex(d => [...A.precioDia.keys()].some(k => k.startsWith(iso(d).slice(0, 7)))); cal._k = Math.max(0, i); }
  armarCalendario(cal, p);
}
function armarCalendario(el, p) {
  const A = datosAgenda(p);
  const d0 = A.meses[el._k], y = d0.getFullYear(), m = d0.getMonth();
  const n = new Date(y, m + 1, 0).getDate(), hueco = (new Date(y, m, 1).getDay() + 6) % 7;
  let celdas = "", hayTarifa = false;
  for (let i = 0; i < hueco; i++) celdas += "<span></span>";
  for (let d = 1; d <= n; d++) {
    const k = iso(new Date(y, m, d)), pasado = k < A.hoy, oc = A.occ.has(k), x = A.precioDia.get(k);
    const conTarifa = A.sinTarifas || !!x; if (x) hayTarifa = true;
    const cls = oc ? "oc" : conTarifa ? "li" : "st";
    const tit = x ? `${periodo(x.periodo)} · ${mon(x.moneda)} ${fmt(x.precio)}` : "";
    celdas += `<span class="d ${cls}${pasado ? " pas" : ""}${k === A.hoy ? " hoy" : ""}"${tit ? ` title="${esc(tit)}"` : ""}>${d}</span>`;
  }
  const nombre = new Intl.DateTimeFormat(LANG === "en" ? "en-US" : LANG, { month: "long", year: "numeric" }).format(d0).replace(/^./, c => c.toUpperCase());
  el.innerHTML = `<div class="cal-cab">
      <button type="button" class="cal-ant" aria-label="‹" ${el._k === 0 ? "disabled" : ""}>‹</button>
      <span>${esc(nombre)}</span>
      <button type="button" class="cal-sig" aria-label="›" ${el._k === A.meses.length - 1 ? "disabled" : ""}>›</button></div>
    <div class="cal-grid">${[...t("dias_sem")].map(x => `<b>${x}</b>`).join("")}${celdas}</div>
    <div class="cal-pie"><span class="cal-ley"><i class="li"></i>${t("disponible")} <i class="oc"></i>${t("ocupado")}${!A.sinTarifas ? ` <i class="st"></i>${t("sin_tarifa")}` : ""}</span></div>`;
  el.querySelector(".cal-ant").addEventListener("click", e => { e.preventDefault(); e.stopPropagation(); el._k--; armarCalendario(el, p); });
  el.querySelector(".cal-sig").addEventListener("click", e => { e.preventDefault(); e.stopPropagation(); el._k++; armarCalendario(el, p); });
}

/* --- pin --- */
function htmlPin(p, filtroOp) {
  const o = opPrincipal(p, filtroOp);
  return `<a class="pin ${o.tipo}${p.tipo === "terreno" ? " es-terreno" : ""}" href="${esc(p.url)}" target="_blank" rel="noopener" aria-label="${esc(precioOp(o))}, ${esc(lineaSecundaria(p))}">
    <span class="dot"></span><span class="tag"><b>${esc(precioCorto(o))}</b><span>${esc(lineaSecundaria(p))}</span></span></a>`;
}

/* --- modo interno (solo equipo) ---
   Engranaje discreto en una esquina → contraseña → se habilitan funciones internas (ej. botón a la carpeta de Drive del desarrollo).
   Los datos internos viajan cifrados en interno.dat (AES-GCM, clave derivada de la contraseña con PBKDF2): sin la contraseña
   no hay forma de leerlos desde el código de la página. Se descifra en el navegador y queda en INTERNO.datos.
   Las páginas escuchan el evento "interno" para volver a dibujarse al entrar o salir. */
const INTERNO = {
  datos: null,
  activo() { return !!this.datos; },
  dev(slug) { return ((this.datos || {}).desarrollos || {})[slug] || {}; },
};
(function () {
  const K = "cbz_interno";
  const sesion = { get: () => { try { return sessionStorage.getItem(K); } catch (_) { return null; } }, set: v => { try { sessionStorage.setItem(K, v); } catch (_) {} }, del: () => { try { sessionStorage.removeItem(K); } catch (_) {} } };
  try { INTERNO.datos = JSON.parse(sesion.get() || leer(K) || "null"); } catch (_) { INTERNO.datos = null; }
  const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  async function descifrar(clave) {
    const r = await fetch(raiz() + "interno.dat", { cache: "no-cache" });
    if (!r.ok) throw new Error("sin-archivo");
    const j = await r.json();
    const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(clave), "PBKDF2", false, ["deriveKey"]);
    const llave = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: b64(j.s), iterations: j.it, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);

  }

  #cbz-int-m button.pri{background:#c8b28a;border-color:#c8b28a;color:#111}`;
  document.head.appendChild(css);
  const eng = document.createElement("button");
  eng.id = "cbz-int"; eng.type = "button";
  eng.innerHTML = '<svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" d="M12 8.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7ZM10.3 3h3.4l.5 2.4 1.7.7 2.1-1.3 2.4 2.4-1.3 2.1.7 1.7 2.4.5v3.4l-2.4.5-.7 1.7 1.3 2.1-2.4 2.4-2.1-1.3-1.7.7-.5 2.4h-3.4l-.5-2.4-1.7-.7-2.1 1.3-2.4-2.4 1.3-2.1-.7-1.7L3 13.7v-3.4l2.4-.5.7-1.7-1.3-2.1 2.4-2.4 2.1 1.3 1.7-.7z"/></svg>';
  const estado = () => { eng.classList.toggle("on", INTERNO.activo()); eng.setAttribute("aria-label", INTERNO.activo() ? "Modo interno activo" : "Acceso interno"); eng.title = eng.getAttribute("aria-label"); };
  estado();
  document.body.appendChild(eng);
  function cerrar() { const m = document.getElementById("cbz-int-m"); if (m) m.remove(); eng.focus(); }
  function modal(html) {
    cerrar();
    const m = document.createElement("div");
    m.id = "cbz-int-m"; m.innerHTML = html;
    m.addEventListener("click", e => { if (e.target === m) cerrar(); });
    m.addEventListener("keydown", e => { if (e.key === "Escape") cerrar(); });
    document.body.appendChild(m);
    return m;
  }
  eng.addEventListener("click", () => {
    if (INTERNO.activo()) {
      const m = modal('<div class="c" role="dialog" aria-modal="true"><h3>Modo interno</h3><p>Activo: ves las funciones solo para el equipo.</p><div class="fila"><button type="button" data-x>Cerrar</button><button type="button" class="pri" data-salir>Salir del modo interno</button></div></div>');

  mapa.invalidateSize();
  if (k === "zona") { capaLugares.addTo(mapa); if (!sinMover) mapa.flyToBounds(encuadrePlano().extend(L.latLngBounds(DATOS.cerca.map(l => [l.lat, l.lng]))), { ...pad(), duration: 1 }); }
  else { mapa.removeLayer(capaLugares); if (!sinMover) mapa.flyToBounds(encuadrePlano(), { ...pad(), maxZoom: 17, duration: 1 }); }
  track("vista/" + k);
}
/* números de lote: se muestran cuando el lote mide en pantalla lo suficiente (lotes grandes = desde más arriba) */
const ladoLote = (() => { const a = (PL && PL.lotes || []).map(l => l.m2).filter(Boolean).sort((x, y) => x - y); return a.length ? Math.sqrt(a[a.length >> 1]) : 30; })();
const zoomNum = Math.min(16.5, Math.log2(156543 * Math.cos(DEV.lat * Math.PI / 180) * 18 / ladoLote));
const verNum = () => mapa.getContainer().classList.toggle("sin-num", mapa.getZoom() < zoomNum);
mapa.on("zoomend", verNum); verNum();

/* ---------- hoja (celular) ---------- */
const hoja = $("hoja");
function cerrarHoja() { hoja.classList.remove("abierta"); }
$("asa").addEventListener("click", e => { if (!e.target.closest("a,button")) hoja.classList.toggle("abierta"); });
let y0 = null;
$("asa").addEventListener("touchstart", e => { y0 = e.touches[0].clientY; }, { passive: true });
$("asa").addEventListener("touchend", e => {
  if (y0 == null) return; const dy = e.changedTouches[0].clientY - y0; y0 = null;
  if (dy < -30) hoja.classList.add("abierta"); else if (dy > 30) cerrarHoja();
});

/* ---------- masterplan (imagen del plano, con zoom) ---------- */
let mpMapa = null;
let mpB = null, mpIni = false;
/* la imagen cubre toda la pantalla (sin bordes negros): zoom mínimo = el que llena el alto y el ancho; se recorre con el dedo */
function mpCubrir() {
  if (!mpMapa || !mpB) return;
  mpMapa.invalidateSize();
  const sz = mpMapa.getSize(), ih = mpB[1][0], iw = mpB[1][1];
  if (!sz.x || !sz.y) return;
  const z = Math.log2(Math.max(sz.x / iw, sz.y / ih));
  mpMapa.setMinZoom(z); mpMapa.setMaxZoom(Math.max(z + 2.5, 1));
  if (!mpIni) { mpIni = true; mpMapa.setView([ih / 2, iw / 2], z, { animate: false }); }
  else if (mpMapa.getZoom() < z) mpMapa.setZoom(z, { animate: false });
  mpMapa.panInsideBounds(L.latLngBounds(mpB), { animate: false });
}
function armarMasterplan() {
  if (mpMapa) { mpCubrir(); return; }
  mpMapa = L.map("mp", { crs: L.CRS.Simple, zoomControl: !movil(), attributionControl: false, zoomSnap: 0, zoomDelta: .5, minZoom: -5, maxZoom: 3, bounceAtZoomLimits: false, maxBoundsViscosity: 1 });
  if (mpMapa.zoomControl) mpMapa.zoomControl.setPosition("bottomright");
  const img = new Image();
  img.onload = () => {
    const b = [[0, 0], [img.naturalHeight, img.naturalWidth]];
    L.imageOverlay(MP, b).addTo(mpMapa);
    mpB = b;
    mpMapa.setMaxBounds(b);
    mpCubrir();
    mpMapa.once("zoomstart dragstart", () => $("ayuda-mp").classList.add("fuera"));
  };
  img.src = MP;
}

function todo() { pintar(); dibujarPlano(); if (VISTA === "zona") capaLugares.addTo(mapa); else mapa.removeLayer(capaLugares); if (MP) $("ayuda-mp").textContent = t(tactil ? "ayuda_mp_t" : "ayuda_mp"); }
armarIdiomas($("idiomas-m"), todo);
document.addEventListener("interno", todo);
todo();
mapa.fitBounds(encuadrePlano(), { ...pad(), maxZoom: PL ? 17 : 15.5 });
mapa.getContainer().classList.toggle("sin-num", mapa.getZoom() < 16.5);
window.addEventListener("resize", () => { mapa.invalidateSize(); mpCubrir(); });
</script>
