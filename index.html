<style>
/* Layout: compu = panel negro a la izquierda + satélite; celular = solo satélite con capas flotantes. Diseño de un solo tema (negro). */
:root{
  --ink:#0a0a0a; --panel:#101010; --raise:#181818; --glass:rgba(12,12,12,.72);
  --line:rgba(255,255,255,.09); --line-2:rgba(255,255,255,.18);
  --fg:#f3f1ec; --muted:#9b978f; --dim:#6d6a64; --champ:#c8b28a;
  --f-display:"Bodoni Moda","Didot","Bodoni 72",Georgia,serif;
  --f-body:"Hanken Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--ink);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
a{color:inherit}

.app{display:grid;grid-template-columns:minmax(360px,420px) 1fr;height:100%}

/* ---------- Panel (solo compu) ---------- */
.panel{display:flex;flex-direction:column;min-height:0;min-width:0;background:var(--panel);border-right:1px solid var(--line)}
.head{display:grid;gap:14px;padding-block:28px 22px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:28px}
.logo-wrap{display:flex;justify-content:center;padding-bottom:22px;border-bottom:1px solid var(--line)}
.logo{display:block;height:44px;width:auto;max-width:100%}
.logo-m{display:block;height:16px;width:auto;max-width:100%;margin-bottom:6px}
.marca{display:flex;align-items:center;gap:10px;font-size:10.5px;font-weight:600;letter-spacing:.24em;text-transform:uppercase;color:var(--fg)}
.marca img{height:28px;width:auto}
.marca .sep{width:1px;height:12px;background:var(--line-2)}
.marca .sub{color:var(--muted)}
.titulo{display:grid;gap:4px;margin-top:18px}
.zona{font-size:11px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:var(--champ)}
h1{font-family:var(--f-display);font-style:italic;font-weight:500;font-size:46px;line-height:1;letter-spacing:-.01em;margin:0;text-wrap:balance}
.bajada{margin:0;color:var(--muted);font-size:14px;max-width:44ch}
.stats{display:grid;grid-template-columns:auto 1fr;gap:28px;padding-top:16px;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
.stat{display:grid;gap:2px}
.stat b{font-size:20px;font-weight:600;letter-spacing:-.01em}
.stat span{font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim)}

.filtros{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line-2);background:transparent;border-radius:999px;padding:6px 13px;font-size:12.5px;font-weight:600;color:var(--muted);cursor:pointer;transition:background .15s,color .15s,border-color .15s}
.chip:hover{color:var(--fg);border-color:var(--fg)}
.chip[aria-pressed="true"]{background:var(--fg);border-color:var(--fg);color:var(--ink)}
.chip:focus-visible,.btn:focus-visible,.card:focus-visible{outline:2px solid var(--champ);outline-offset:2px}
.head .filtros{padding-top:4px}

.lista{list-style:none;margin:0;padding-block:4px 28px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:28px;display:grid;gap:22px;overflow:auto;min-height:0;scrollbar-width:thin;scrollbar-color:var(--line-2) transparent}
.card{display:grid;gap:12px;cursor:pointer;border-radius:4px}
.card .media{position:relative;aspect-ratio:16/10;max-width:100%;overflow:hidden;border-radius:4px;background:var(--raise)}
.card .media img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .6s cubic-bezier(.2,.7,.2,1),filter .3s;filter:saturate(.92)}
.card:hover .media img,.card.on .media img{transform:scale(1.04);filter:saturate(1)}
.card .lote{position:absolute;left:10px;top:10px;background:var(--glass);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid var(--line);padding:4px 9px;border-radius:999px;font-size:10.5px;font-weight:600;letter-spacing:.16em;text-transform:uppercase}
.card .fila{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.precio{font-family:var(--f-display);font-size:26px;font-weight:500;letter-spacing:-.01em;font-variant-numeric:lining-nums tabular-nums;line-height:1}
.precio small{font-family:var(--f-body);font-size:11px;font-weight:600;letter-spacing:.14em;color:var(--muted);margin-right:6px;vertical-align:4px}
.specs{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;color:var(--muted)}
.specs span+span::before{content:"";display:inline-block;width:3px;height:3px;border-radius:50%;background:var(--dim);vertical-align:3px;margin-right:14px;margin-left:-0px}
.ver{font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;text-decoration:none;color:var(--fg);border-bottom:1px solid var(--line-2);padding-bottom:2px;white-space:nowrap}
.ver:hover{border-color:var(--fg)}
.card.oculta{display:none}
.vacio{color:var(--muted);font-size:14px}
.pie{padding-block:14px 18px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:28px;border-top:1px solid var(--line);font-size:11px;color:var(--dim)}

/* ---------- Mapa ---------- */
.mapa-wrap{position:relative;min-width:0;min-height:0;overflow:hidden}
#mapa{position:absolute;inset:0;background:#0c0f0c}
.mapa-wrap::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:450;background:radial-gradient(120% 90% at 50% 45%,transparent 55%,rgba(0,0,0,.45) 100%)}
.leaflet-image-layer{filter:brightness(.82) contrast(1.08) saturate(.85)}
.leaflet-container{font-family:var(--f-body);background:#0c0f0c}
.leaflet-control-attribution{background:rgba(0,0,0,.55)!important;color:#8d8a84!important;font-size:10px}
.leaflet-control-attribution a{color:#b8b4ac!important}
.leaflet-bar{border:1px solid var(--line-2)!important;box-shadow:none!important;border-radius:999px!important;overflow:hidden}
.leaflet-bar a{background:var(--glass)!important;color:var(--fg)!important;border-bottom:1px solid var(--line)!important;backdrop-filter:blur(10px);width:36px!important;height:36px!important;line-height:36px!important}
.leaflet-bar a:last-child{border-bottom:0!important}
.leaflet-bar a:hover{background:#000!important}
.leaflet-touch .leaflet-control-zoom{margin-right:calc(16px + env(safe-area-inset-right,0px))!important;margin-bottom:calc(24px + env(safe-area-inset-bottom,0px))!important}

/* Pines */
.pin-icon{background:none;border:0}
/* Pin rojo en gota: la punta cae justo sobre la coordenada del lote */
.pin{--rojo:#e3141e;position:absolute;left:0;top:0;display:flex;align-items:center;gap:8px;text-decoration:none;white-space:nowrap;transform:translate(-11px,-27px);transition:opacity .25s}
.pin .dot{position:relative;width:22px;height:27px;flex:none;transform-origin:50% 100%;transition:transform .2s}
.pin .dot::before{content:"";position:absolute;left:0;top:0;width:22px;height:22px;background:var(--rojo);border-radius:50% 50% 50% 0;transform:rotate(-45deg);box-shadow:0 0 0 1.5px rgba(255,255,255,.9),-2px 4px 10px rgba(0,0,0,.55)}
.pin .dot::after{content:"";position:absolute;left:7px;top:7px;width:8px;height:8px;border-radius:50%;background:#0a0a0a}
.pin::before{content:"";position:absolute;left:-3px;top:21px;width:28px;height:12px;border-radius:50%;border:1.5px solid var(--rojo);opacity:0;transform:scale(.4)}
.pin.on::before{animation:ping 1.6s ease-out infinite}
@keyframes ping{0%{opacity:.95;transform:scale(.4)}100%{opacity:0;transform:scale(1.7)}}
.pin .tag{display:grid;line-height:1.1;gap:2px;background:rgba(10,10,10,.86);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);color:#f3f1ec;border:1px solid rgba(255,255,255,.14);border-radius:6px;padding:6px 10px;box-shadow:0 6px 18px rgba(0,0,0,.45);font-variant-numeric:tabular-nums;transition:background .2s,color .2s,transform .2s;transform-origin:left center}
.pin .tag b{font-size:13px;font-weight:700;letter-spacing:.01em}
.pin .tag span{font-size:10.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:#a5a19a}
.pin:hover .tag,.pin.on .tag{background:#f3f1ec;color:#0a0a0a;transform:scale(1.06)}
.pin:hover .tag span,.pin.on .tag span{color:#57534d}
.pin:hover .dot,.pin.on .dot{transform:translateY(-3px) scale(1.12)}
.pin.apagado{opacity:0;pointer-events:none}
.pin:focus-visible .tag{outline:2px solid var(--champ);outline-offset:2px}

.pin{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}

/* Ventanita sobre el pin: carrusel de fotos */
.preview.leaflet-popup{margin-bottom:20px}
.preview .leaflet-popup-content-wrapper{background:#0d0d0d;color:var(--fg);border:1px solid var(--line-2);border-radius:10px;box-shadow:0 18px 50px rgba(0,0,0,.65);padding:0;overflow:hidden}
.preview .leaflet-popup-content{margin:0;width:272px!important;line-height:1.4}
.preview .leaflet-popup-tip{background:#0d0d0d;border:1px solid var(--line-2)}
.preview a.leaflet-popup-close-button{display:none}
.carr{position:relative;background:var(--raise)}
.carr .pista-f{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;touch-action:pan-x;overscroll-behavior-x:contain}
.carr .pista-f::-webkit-scrollbar{display:none}
.carr img{flex:0 0 100%;width:100%;aspect-ratio:4/3;object-fit:cover;scroll-snap-align:start;display:block}
.carr .flecha{position:absolute;top:50%;transform:translateY(-50%);width:30px;height:30px;border-radius:50%;border:1px solid rgba(255,255,255,.25);background:rgba(10,10,10,.6);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);color:#fff;display:grid;place-items:center;cursor:pointer;font-size:15px;line-height:1;opacity:.9;transition:opacity .15s,background .15s}
.carr .flecha:hover{background:#000}
.carr .flecha:disabled{opacity:0;pointer-events:none}
.carr .ant{left:8px}.carr .sig{right:8px}
.carr .flecha:focus-visible{outline:2px solid var(--champ);outline-offset:2px}
.carr .cont{position:absolute;right:8px;bottom:8px;background:rgba(10,10,10,.65);color:#fff;font-size:11px;font-weight:600;letter-spacing:.06em;padding:3px 8px;border-radius:999px;font-variant-numeric:tabular-nums}
.carr .puntos{position:absolute;left:0;right:0;bottom:10px;display:flex;justify-content:center;gap:5px;pointer-events:none}
.carr .puntos i{width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,.45);transition:background .2s,transform .2s}
.carr .puntos i.on{background:#fff;transform:scale(1.3)}
.prev .cuerpo{display:grid;gap:6px;padding:12px 14px 14px}
.prev .linea{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.prev .precio{font-size:22px}
.prev .pista{font-size:10.5px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--champ)}
.prev .specs{font-size:12.5px}
.prev .ver{font-size:11px}
@media (hover:hover){.carr .flecha{opacity:0}.carr:hover .flecha:not(:disabled){opacity:.9}}

/* Capas flotantes (celular) */
.top{display:none}

@media (max-width:899px){
  .app{display:block;height:100%}
  .panel{display:none}
  .mapa-wrap{position:fixed;inset:0}
  .top{display:grid;gap:10px;position:absolute;z-index:600;left:0;right:0;top:0;padding-top:calc(12px + env(safe-area-inset-top,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));pointer-events:none}
  .barra{pointer-events:auto;display:grid;gap:10px;background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
  .barra .logo-m{justify-self:center;margin:0;padding-bottom:10px;box-sizing:content-box;border-bottom:1px solid var(--line);width:auto}
  .barra .fila-b{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;min-width:0}
  .barra h2{font-family:var(--f-display);font-style:italic;font-weight:500;font-size:26px;line-height:1;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
  .barra .cuenta{text-align:right;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
  .barra .cuenta b{display:block;font-size:20px;letter-spacing:0;color:var(--fg);font-variant-numeric:tabular-nums}
  .top .filtros{pointer-events:auto;overflow-x:auto;flex-wrap:nowrap;scrollbar-width:none;padding-bottom:2px}
  .top .chip{background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-color:var(--line-2);color:var(--fg);white-space:nowrap}
  .top .chip[aria-pressed="true"]{background:var(--fg);color:var(--ink)}
  .ayuda{position:absolute;z-index:600;left:50%;transform:translateX(-50%);bottom:calc(26px + env(safe-area-inset-bottom,0px));background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);color:var(--fg);font-size:10.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;padding:9px 14px;border-radius:999px;white-space:nowrap;pointer-events:none;transition:opacity .3s}
  .ayuda.fuera{opacity:0}
  .leaflet-control-zoom{display:none}
  .preview .leaflet-popup-content{width:250px!important}
}
@media (min-width:900px){.ayuda{display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

</head>
<body>
<div class="app">
  <aside class="panel">
    <header class="head">
      <div class="logo-wrap"><img class="logo" src="logo-apilado.png" alt="Coldwell Banker Zetaté" width="190" height="40"></div>
      <div class="titulo">
        <span class="zona" id="zona"></span>
        <h1 id="nombre"></h1>
      </div>
      <p class="bajada" id="bajada"></p>
      <div class="stats">
        <div class="stat"><b id="st-cant"></b><span>Casas</span></div>
        <div class="stat"><b id="st-rango"></b><span>Rango de precios</span></div>
      </div>
      <div class="filtros" id="filtros-panel" role="group" aria-label="Filtrar por dormitorios"></div>
    </header>
    <ul class="lista" id="lista"></ul>
    <div class="pie">Precios en dólares estadounidenses. Pasá el mouse por un pin para ver fotos; click para abrir la ficha.</div>
  </aside>

  <main class="mapa-wrap">
    <div id="mapa" aria-label="Mapa satelital del barrio"></div>

    <div class="top">
      <div class="barra">
        <img class="logo-m" src="logo-horizontal.png" alt="Coldwell Banker Zetaté" width="148" height="16">
        <div class="fila-b">
          <h2 id="nombre-m"></h2>
          <div class="cuenta"><b id="cuenta-m"></b>casas</div>
        </div>
      </div>
      <div class="filtros" id="filtros-movil" role="group" aria-label="Filtrar por dormitorios"></div>
    </div>

    <div class="ayuda" id="ayuda">Mantené apretado un pin para ver fotos</div>
  </main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
const DATOS = {"nombre": "Pueblo Mío", "zona": "Manantiales · Punta del Este", "bajada": "Barrio privado sobre ruta 104, a 4 km de Manantiales. 159 hectáreas, 86 de áreas comunes y nueve lagunas.", "imagen": "satelite.jpg", "bounds": [[-34.874665167612605, -54.84649658203125], [-34.85663671905172, -54.8162841796875]], "propiedades": [{"codigo": "BPV8096", "url": "https://ficha.amaira.com.ar/fichaC.php?ficha=BPV8096", "precio": 1190000, "dormitorios": 3, "lat": -34.86408891548942, "lng": -54.82521117897705, "lote": "39", "banos": 3.0, "m2_cubiertos": 220.0, "m2_terreno": 4000.0, "fotos": ["fotos/bpv8096-1.jpg", "fotos/bpv8096-2.jpg", "fotos/bpv8096-3.jpg", "fotos/bpv8096-4.jpg", "fotos/bpv8096-5.jpg", "fotos/bpv8096-6.jpg", "fotos/bpv8096-7.jpg", "fotos/bpv8096-8.jpg"], "foto": "fotos/bpv8096-1.jpg"}, {"codigo": "BPV10933", "url": "https://ficha.amaira.com.ar/fichaC.php?ficha=BPV10933", "precio": 1280000, "dormitorios": 4, "lat": -34.861035, "lng": -54.822801, "_nota": "Pin corregido a mano sobre la casa (el de la ficha caía en la entrada del barrio)", "lote": "41", "banos": 5.0, "m2_cubiertos": 282.0, "m2_terreno": 4000.0, "fotos": ["fotos/bpv10933-1.jpg", "fotos/bpv10933-2.jpg", "fotos/bpv10933-3.jpg", "fotos/bpv10933-4.jpg", "fotos/bpv10933-5.jpg", "fotos/bpv10933-6.jpg", "fotos/bpv10933-7.jpg", "fotos/bpv10933-8.jpg"], "foto": "fotos/bpv10933-1.jpg"}, {"codigo": "BPV10790", "url": "https://ficha.amaira.com.ar/fichaC.php?ficha=BPV10790", "precio": 1500000, "dormitorios": 3, "lat": -34.86755, "lng": -54.841062, "_nota": "Pin corregido a mano sobre la casa (el de la ficha caía en el camino)", "lote": "148", "banos": 3.5, "m2_cubiertos": 320.0, "m2_terreno": 4000.0, "fotos": ["fotos/bpv10790-1.jpg", "fotos/bpv10790-2.jpg", "fotos/bpv10790-3.jpg", "fotos/bpv10790-4.jpg", "fotos/bpv10790-5.jpg", "fotos/bpv10790-6.jpg", "fotos/bpv10790-7.jpg", "fotos/bpv10790-8.jpg"], "foto": "fotos/bpv10790-1.jpg"}, {"codigo": "BPV10981", "url": "https://ficha.amaira.com.ar/fichaC.php?ficha=BPV10981&noweb=true", "precio": 1650000, "dormitorios": 4, "lat": -34.869903, "lng": -54.837136, "_nota": "Pin corregido a mano sobre la casa (el de la ficha caía en un terreno vacío)", "lote": "156", "banos": 6.0, "m2_cubiertos": 300.0, "m2_terreno": null, "fotos": ["fotos/bpv10981-1.jpg", "fotos/bpv10981-2.jpg", "fotos/bpv10981-3.jpg", "fotos/bpv10981-4.jpg", "fotos/bpv10981-5.jpg", "fotos/bpv10981-6.jpg", "fotos/bpv10981-7.jpg", "fotos/bpv10981-8.jpg"], "foto": "fotos/bpv10981-1.jpg"}, {"codigo": "BPV8877", "url": "https://ficha.amaira.com.ar/fichaC.php?ficha=BPV8877", "precio": 1690000, "dormitorios": 4, "lat": -34.86110474208281, "lng": -54.8250340126892, "lote": "3", "banos": 5.5, "m2_cubiertos": 400.0, "m2_terreno": 4006.0, "fotos": ["fotos/bpv8877-1.jpg", "fotos/bpv8877-2.jpg", "fotos/bpv8877-3.jpg", "fotos/bpv8877-4.jpg", "fotos/bpv8877-5.jpg", "fotos/bpv8877-6.jpg", "fotos/bpv8877-7.jpg", "fotos/bpv8877-8.jpg"], "foto": "fotos/bpv8877-1.jpg"}]};
const P = DATOS.propiedades;

const fmt = n => n.toLocaleString("es-UY");
const usd = n => "U$S " + fmt(n);
const corto = n => "U$S " + (n >= 1e6 ? (n / 1e6).toFixed(2).replace(/0$/, "").replace(".", ",") + "M" : Math.round(n / 1e3) + "K");
const banos = b => b == null ? null : (b % 1 ? Math.floor(b) + "½" : b) + (b === 1 ? " baño" : " baños");
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const specs = p => [p.dormitorios + " dorm.", banos(p.banos), p.m2_cubiertos ? Math.round(p.m2_cubiertos) + " m²" : null]
  .filter(Boolean).map(s => `<span>${esc(s)}</span>`).join("");
const tactil = window.matchMedia("(hover: none)").matches;
const movil = () => window.matchMedia("(max-width:899px)").matches;

/* Encabezados */
for (const id of ["nombre", "nombre-m"]) document.getElementById(id).textContent = DATOS.nombre;
document.getElementById("zona").textContent = DATOS.zona;
document.getElementById("bajada").textContent = DATOS.bajada;
const precios = P.map(p => p.precio);
document.getElementById("st-rango").textContent = `${corto(Math.min(...precios))} – ${corto(Math.max(...precios))}`;

/* Mapa */
const mapa = L.map("mapa", { zoomSnap: 0.25, zoomControl: false, attributionControl: true });
L.control.zoom({ position: "bottomright" }).addTo(mapa);
L.imageOverlay(DATOS.imagen, DATOS.bounds).addTo(mapa);
mapa.attributionControl.setPrefix(false).addAttribution("Esri, Maxar, Earthstar Geographics");
const limites = L.latLngBounds(DATOS.bounds);
mapa.setMaxBounds(limites.pad(0.05));
const relleno = () => movil() ? { paddingTopLeft: [24, 170], paddingBottomRight: [24, 70] } : { padding: [70, 70] };
const encuadrar = (lista = P) => mapa.fitBounds(L.latLngBounds(lista.map(p => [p.lat, p.lng])), { ...relleno(), maxZoom: 17 });
encuadrar();
mapa.setMinZoom(Math.max(mapa.getBoundsZoom(limites, true), 13));
mapa.setMaxZoom(19);

/* Ventanita con carrusel */
const ayuda = document.getElementById("ayuda");
const vista = L.popup({
  className: "preview", closeButton: false, autoPan: true, offset: [0, -26], maxWidth: 290,
  autoPanPaddingTopLeft: L.point(16, movil() ? 190 : 20), autoPanPaddingBottomRight: L.point(16, 20)
});
const htmlVista = p => {
  const f = p.fotos?.length ? p.fotos : (p.foto ? [p.foto] : []);
  return `<div class="prev">
    ${f.length ? `<div class="carr">
      <div class="pista-f" tabindex="0" aria-label="Fotos de la casa">${f.map((s, k) =>
        `<img src="${esc(s)}" alt="Foto ${k + 1} de ${f.length}" ${k > 1 ? 'loading="lazy"' : ""} draggable="false">`).join("")}</div>
      ${f.length > 1 ? `<button class="flecha ant" type="button" aria-label="Foto anterior" disabled>‹</button>
      <button class="flecha sig" type="button" aria-label="Foto siguiente">›</button>
      <span class="cont">1 / ${f.length}</span>
      <div class="puntos">${f.map((_, k) => `<i class="${k ? "" : "on"}"></i>`).join("")}</div>` : ""}
    </div>` : ""}
    <div class="cuerpo">
      ${p.lote ? `<span class="pista">Lote ${esc(p.lote)}</span>` : ""}
      <div class="linea"><span class="precio"><small>U$S</small>${fmt(p.precio)}</span>
        <a class="ver" href="${esc(p.url)}" target="_blank" rel="noopener">Ver ficha ↗</a></div>
      <span class="specs">${specs(p)}</span>
    </div></div>`;
};
function armarCarrusel(raiz) {
  const pista = raiz.querySelector(".pista-f"); if (!pista) return;
  const n = pista.children.length;
  const ant = raiz.querySelector(".ant"), sig = raiz.querySelector(".sig");
  const cont = raiz.querySelector(".cont"), puntos = raiz.querySelectorAll(".puntos i");
  const idx = () => Math.round(pista.scrollLeft / pista.clientWidth);
  const pintar = () => {
    const k = idx();
    if (cont) cont.textContent = `${k + 1} / ${n}`;
    puntos.forEach((d, j) => d.classList.toggle("on", j === k));
    if (ant) ant.disabled = k === 0;
    if (sig) sig.disabled = k === n - 1;
  };
  const ir = d => pista.scrollTo({ left: (idx() + d) * pista.clientWidth, behavior: "smooth" });
  ant?.addEventListener("click", e => { e.stopPropagation(); ir(-1); });
  sig?.addEventListener("click", e => { e.stopPropagation(); ir(1); });
  pista.addEventListener("scroll", () => requestAnimationFrame(pintar), { passive: true });
  pista.addEventListener("keydown", e => { if (e.key === "ArrowRight") ir(1); if (e.key === "ArrowLeft") ir(-1); });
  L.DomEvent.disableScrollPropagation(pista);
}

let abiertaDe = null, timerCierre = null;
function abrirVista(i) {
  clearTimeout(timerCierre);
  if (abiertaDe === i && mapa.hasLayer(vista)) return;
  const p = P[i];
  seleccionar(i);
  vista.setLatLng([p.lat, p.lng]).setContent(htmlVista(p)).openOn(mapa);
  abiertaDe = i;
  const c = vista.getElement();
  armarCarrusel(c);
  c.onmouseenter = () => clearTimeout(timerCierre);
  c.onmouseleave = () => { if (!tactil) cerrarLuego(); };
  ayuda.classList.add("fuera");
}
function cerrarLuego() { clearTimeout(timerCierre); timerCierre = setTimeout(cerrarVista, 280); }
function cerrarVista() { mapa.closePopup(vista); }
mapa.on("popupclose", e => { if (e.popup === vista) { abiertaDe = null; seleccionar(null); } });

/* Pines + tarjetas */
const items = [];
let actual = null;
const lista = document.getElementById("lista");

function marcar(i, on) {
  const it = items[i]; if (!it) return;
  it.card.classList.toggle("on", on);
  it.pinEl()?.classList.toggle("on", on);
  it.m.setZIndexOffset(on ? 1000 : 0);
}
function seleccionar(i) {
  if (actual != null && actual !== i) marcar(actual, false);
  actual = i;
  if (i != null) marcar(i, true);
}

P.forEach((p, i) => {
  const icono = L.divIcon({
    className: "pin-icon", iconSize: [0, 0],
    html: `<a class="pin" href="${esc(p.url)}" target="_blank" rel="noopener" aria-label="${esc(usd(p.precio))}, ${p.dormitorios} dormitorios, abrir ficha"><span class="dot"></span><span class="tag"><b>${usd(p.precio)}</b><span>${p.dormitorios} dormitorios</span></span></a>`
  });
  const m = L.marker([p.lat, p.lng], { icon: icono, keyboard: false }).addTo(mapa);
  const pinEl = () => m.getElement()?.querySelector(".pin");

  const li = document.createElement("li");
  li.className = "card"; li.tabIndex = 0;
  li.innerHTML = `
    <div class="media">${p.foto ? `<img src="${esc(p.foto)}" alt="Casa en ${esc(DATOS.nombre)}, lote ${esc(p.lote)}" loading="lazy">` : ""}
      ${p.lote ? `<span class="lote">Lote ${esc(p.lote)}</span>` : ""}</div>
    <div class="fila"><span class="precio"><small>U$S</small>${fmt(p.precio)}</span>
      <a class="ver" href="${esc(p.url)}" target="_blank" rel="noopener">Ver ficha ↗</a></div>
    <div class="specs">${specs(p)}</div>`;
  lista.appendChild(li);
  items.push({ p, m, card: li, pinEl });

  const el = m.getElement();

  /* Compu: pasar el mouse = ventanita con fotos; click = abre la ficha */
  el.addEventListener("mouseenter", () => { if (!tactil) abrirVista(i); });
  el.addEventListener("mouseleave", () => { if (!tactil) cerrarLuego(); });

  /* Celular: tocar = abre la ficha; mantener apretado = ventanita con fotos */
  let timerLargo = null, largo = false, x0 = 0, y0 = 0;
  el.addEventListener("touchstart", e => {
    largo = false;
    const t = e.touches[0]; x0 = t.clientX; y0 = t.clientY;
    clearTimeout(timerLargo);
    timerLargo = setTimeout(() => {
      largo = true;
      if (navigator.vibrate) try { navigator.vibrate(12); } catch (_) {}
      abrirVista(i);
    }, 420);
  }, { passive: true });
  el.addEventListener("touchmove", e => {
    const t = e.touches[0];
    if (Math.hypot(t.clientX - x0, t.clientY - y0) > 10) clearTimeout(timerLargo);
  }, { passive: true });
  el.addEventListener("touchend", e => {
    clearTimeout(timerLargo);
    if (largo) e.preventDefault();
  });
  el.addEventListener("touchcancel", () => clearTimeout(timerLargo));
  el.addEventListener("contextmenu", e => e.preventDefault());
  el.addEventListener("click", e => {
    if (largo) { e.preventDefault(); largo = false; }
  });

  /* Lista (compu) */
  li.addEventListener("mouseenter", () => { if (abiertaDe == null) seleccionar(i); });
  li.addEventListener("mouseleave", () => { if (abiertaDe == null && actual === i) seleccionar(null); });
  const ir = () => {
    cerrarVista();
    seleccionar(i);
    mapa.flyTo([p.lat, p.lng], Math.max(mapa.getZoom(), 17.5), { duration: 0.9 });
    mapa.once("moveend", () => abrirVista(i));
  };
  li.addEventListener("click", e => { if (!e.target.closest("a")) ir(); });
  li.addEventListener("keydown", e => { if (e.key === "Enter" && !e.target.closest("a")) ir(); });
});

/* Filtros por dormitorios */
const opciones = [{ t: "Todas", f: () => true }].concat(
  [...new Set(P.map(p => p.dormitorios))].sort((a, b) => a - b).map(d => ({ t: `${d} dorm.`, f: p => p.dormitorios === d }))
);
function aplicar(k) {
  const visibles = [];
  items.forEach(it => {
    const ok = opciones[k].f(it.p);
    it.card.classList.toggle("oculta", !ok);
    it.pinEl()?.classList.toggle("apagado", !ok);
    if (ok) visibles.push(it.p);
  });
  document.querySelectorAll(".chip").forEach(c => c.setAttribute("aria-pressed", String(+c.dataset.k === k)));
  document.getElementById("st-cant").textContent = visibles.length;
  document.getElementById("cuenta-m").textContent = visibles.length;
  cerrarVista();
  if (visibles.length) encuadrar(visibles);
}
for (const id of ["filtros-panel", "filtros-movil"]) {
  const g = document.getElementById(id);
  opciones.forEach((o, k) => {
    const b = document.createElement("button");
    b.className = "chip"; b.type = "button"; b.dataset.k = k; b.textContent = o.t;
    b.addEventListener("click", () => aplicar(k));
    g.appendChild(b);
  });
}
aplicar(0);

window.addEventListener("resize", () => mapa.invalidateSize());
</script>

</body>
</html>
