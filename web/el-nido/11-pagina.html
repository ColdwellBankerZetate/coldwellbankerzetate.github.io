<script>
document.addEventListener('DOMContentLoaded', () => {
  const nav = document.querySelector('.nav_component');
  const navBgColor = document.querySelector('.nav_bg-color');
  
  // Store the original font color and background color for scroll
  const originalFontColor = getComputedStyle(nav).color;
  const scrolledFontColor = 'black';  // Change this to your scroll-based color
  const scrolledBgColor = 'white';  // Change this to your scroll-based background color
  
  // Function to apply the correct font color based on scroll or visibility of nav_bg-color
  const updateFontColor = () => {
    if (navBgColor.style.display === 'block') {
      nav.style.color = 'white';  // Font color white when nav_bg-color is visible
    } else if (nav.classList.contains('scrolled')) {
      nav.style.color = scrolledFontColor;  // Font color for scrolled state
    } else {
      nav.style.color = originalFontColor;  // Revert to original font color
    }
  };

  // Create a MutationObserver to track changes to the display property of nav_bg-color
  const observer = new MutationObserver(updateFontColor);

  // Observe the 'style' attribute of the .nav_bg-color element
  observer.observe(navBgColor, {
    attributes: true,
    attributeFilter: ['style'],
  });

  // Handle scroll-based color change
  window.addEventListener('scroll', () => {
    if (window.scrollY >= 4 * parseFloat(getComputedStyle(document.documentElement).fontSize)) {
      nav.classList.add('scrolled');
    } else {
      nav.classList.remove('scrolled');
    }
    updateFontColor();  // Update font color based on scroll state
  });

  // Initial font color update on page load
  updateFontColor();
});
</script>


<script>
//Dropdown active for amenities section
document.querySelectorAll('.dropdown-container').forEach(container => {
 container.addEventListener('click', (event) => {
   // Prevent event from bubbling if needed
   event.stopPropagation();

   // Remove active state from all containers
   document.querySelectorAll('.dropdown-container').forEach(el => {
     el.classList.remove('is-active');
     el.querySelector('.dropdown-photo')?.classList.remove('is-active');
     el.querySelector('.dropdown-text')?.classList.remove('is-active');
   });

   // Add active state to clicked container
   container.classList.add('is-active');
   container.querySelector('.dropdown-photo')?.classList.add('is-active');
   container.querySelector('.dropdown-text')?.classList.add('is-active');
 });
});
</script>

<script>
document.addEventListener("DOMContentLoaded", function () {
  // Split text into spans
  let typeSplit = new SplitType("[text-split]", {
    types: "words",
    tagName: "span"
  });

  // Link timelines to scroll position
  function createScrollTrigger(triggerElement, timeline) {
    // Reset timeline when scroll out of view past bottom of screen
    ScrollTrigger.create({
      trigger: triggerElement,
      start: "top bottom",
      onLeaveBack: () => {
        timeline.progress(1);
        timeline.pause();
      }
    }); 
    // Play timeline when scrolled into view (60% from top of screen)
    ScrollTrigger.create({
      trigger: triggerElement,
      start: "top 80%",
      onEnter: () => timeline.play()
    });
  }

  // Animation for elements with [anim-1]
  $("[anim-1]").each(function (index) {
    let tl = gsap.timeline({ paused: true });
    tl.from($(this).find(".word"), {
      yPercent: 25,
      opacity: 0,
      duration: 0.4,
      //ease: "expoScale(0.5,7,power1.inOut)",
      ease: "power3.out",
      stagger: { each: 0.1 }
    });
    createScrollTrigger($(this), tl);
  });
  
    // Animation for .eyebrow elements
  $(".eyebrow").each(function () {
    gsap.from(this, {
      opacity: 0,
      y: "1rem", // Slide up a bit while fading in
      duration: 0.3,
      ease: "power3.out",
      scrollTrigger: {
        trigger: this,
        start: "top 80%",
        toggleActions: "play none none none", // Replay every time it enters viewport
      },
    });
  });
  
  // Avoid flash of unstyled content
  gsap.set("[text-split]", { opacity: 1 });
});  
</script>

<script>

            buttonModal.classList.add('fade-out');
        });
    }
});
</script>

<script>
// Close modal with ESC
document.addEventListener("keydown", function (event) {
  // Check if the pressed key is ESC (Escape key)
  if (event.key === "Escape") {
    // Get all modal wrappers on the page
    var modals = document.querySelectorAll(".modal-wrapper");
    modals.forEach(function (modal) {
      // Check if the modal is visible
      if (getComputedStyle(modal).display !== "none") {
        // Find the close button within the visible modal
        var closeButton = modal.querySelector(".close-modal");
        if (closeButton) {
          // Simulate a click on the close button
          closeButton.click();
        }
      }
    });
  }
});
</script>
