<title>__TITULO__</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,500;1,6..96,500&family=Hanken+Grotesk:wght@400;500;600;700&display=swap">
<style>
/*__LEAFLET_CSS__*/
</style>
<style>
/* Desarrollo = presentación del proyecto: plano (KMZ) sobre el satélite, ubicación, amenities, ventajas, lotes y brochure.
   Compu: panel a la izquierda que se lee de arriba a abajo. Celular: mapa con el plano + hoja que se sube. */
:root{
  --ink:#0a0a0a; --panel:#101010; --raise:#181818; --glass:rgba(12,12,12,.72);
  --line:rgba(255,255,255,.09); --line-2:rgba(255,255,255,.18);
  --fg:#f3f1ec; --muted:#9b978f; --dim:#6d6a64; --champ:#c8b28a; --venta:#e3141e;
  --f-display:"Bodoni Moda","Didot","Bodoni 72",Georgia,serif;
  --f-body:"Hanken Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--ink);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
a{color:inherit}
.app{display:grid;grid-template-columns:minmax(380px,460px) 1fr;height:100%}
.panel{background:var(--panel);border-right:1px solid var(--line);overflow:auto;min-height:0;scrollbar-width:thin;scrollbar-color:var(--line-2) transparent}
.pad{padding-left:max(30px,env(safe-area-inset-left,0px));padding-right:30px}
.barra-sup{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-top:18px;font-size:11px;letter-spacing:.14em;text-transform:uppercase}
.volver{color:var(--muted);text-decoration:none;font-weight:600}
.volver:hover{color:var(--fg)}
.idiomas{display:flex;gap:2px}
.idiomas button{background:none;border:0;padding:4px 6px;font-size:11px;font-weight:600;letter-spacing:.14em;color:var(--dim);cursor:pointer}
.idiomas button[aria-pressed="true"]{color:var(--fg);text-decoration:underline;text-decoration-color:var(--venta);text-underline-offset:5px;text-decoration-thickness:2px}
.logo-wrap{display:flex;justify-content:center;padding-block:14px 20px;border-bottom:1px solid var(--line)}
.logo{display:block;height:44px;width:auto}

.portada{display:grid;gap:12px;padding-top:24px}
.kicker{display:inline-flex;align-items:center;gap:8px;font-size:11px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:var(--champ)}
h1{font-family:var(--f-display);font-style:italic;font-weight:500;font-size:50px;line-height:1;letter-spacing:-.01em;margin:0;text-wrap:balance}
.estado{display:inline-flex;align-items:center;border:1px solid rgba(200,178,138,.45);color:var(--champ);border-radius:999px;padding:3px 11px;font-size:10.5px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;width:max-content}
.galeria{position:relative;border-radius:6px;overflow:hidden;background:var(--raise);margin-top:6px}
.galeria .pista{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.galeria .pista::-webkit-scrollbar{display:none}
.galeria img{flex:0 0 100%;width:100%;aspect-ratio:3/2;object-fit:cover;scroll-snap-align:start;display:block}
.galeria .flecha{position:absolute;top:50%;transform:translateY(-50%);width:34px;height:34px;border-radius:50%;border:1px solid rgba(255,255,255,.25);background:rgba(10,10,10,.6);color:#fff;display:grid;place-items:center;cursor:pointer;font-size:16px;line-height:1;padding:0}
.galeria .ant{left:10px}.galeria .sig{right:10px}
.galeria .cont{position:absolute;right:10px;bottom:10px;background:rgba(10,10,10,.65);color:#fff;font-size:11px;font-weight:600;padding:3px 8px;border-radius:999px;font-variant-numeric:tabular-nums}
.cifras.par{grid-template-columns:1fr 1fr}
.cifras{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-top:6px}
.cifra{background:var(--panel);padding:14px 14px 12px;display:grid;gap:2px}
.cifra b{font-family:var(--f-display);font-size:28px;font-weight:500;line-height:1;font-variant-numeric:lining-nums}
.cifra span{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim)}
.acciones{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:4px}
.b-pri,.b-sec{display:flex;align-items:center;justify-content:center;gap:8px;border-radius:999px;padding:12px 14px;font-size:11.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;text-decoration:none;cursor:pointer;white-space:nowrap}
.b-pri{background:var(--champ);color:var(--ink);border:0}
.b-sec{background:transparent;color:var(--fg);border:1px solid var(--line-2)}
.b-sec:hover{border-color:var(--fg)}
.b-pri:hover{filter:brightness(1.07)}
.acciones .ancho{grid-column:1/-1}

.sec{padding-block:26px 4px;display:grid;gap:12px}
.sec+.sec{border-top:1px solid var(--line);margin-top:22px}
.sec h2{margin:0;font-size:11px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:var(--champ)}
.sec .t{font-family:var(--f-display);font-style:italic;font-weight:500;font-size:28px;line-height:1.05;margin:-4px 0 0}
.texto{margin:0;color:#cfcbc3;font-size:14.5px;white-space:pre-line}
.texto.corto{display:-webkit-box;-webkit-line-clamp:6;-webkit-box-orient:vertical;overflow:hidden}
.mas{background:none;border:0;padding:0;font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--champ);cursor:pointer;justify-self:start}
.cerca{list-style:none;margin:0;padding:0;display:grid}
.cerca li{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.cerca li b{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.nota{font-size:11px;color:var(--dim)}
.amen{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:10px 16px}
.amen li{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;line-height:1.35}
.amen li::before{content:"";flex:none;width:7px;height:7px;margin-top:6px;background:var(--champ);transform:rotate(45deg)}
.ventajas{list-style:none;margin:0;padding:0;display:grid;gap:12px;counter-reset:v}
.ventajas li{display:grid;grid-template-columns:30px 1fr;gap:10px;font-size:14px;line-height:1.4;counter-increment:v}
.ventajas li::before{content:counter(v,decimal-leading-zero);font-family:var(--f-display);font-style:italic;color:var(--champ);font-size:18px;line-height:1.1}
.lotes{width:100%;border-collapse:collapse;font-size:13.5px;font-variant-numeric:tabular-nums}
.lotes th{font-size:10px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);text-align:left;padding:0 0 8px}
.lotes td{padding:10px 0;border-top:1px solid var(--line)}
.lotes th:nth-child(n+2),.lotes td:nth-child(n+2){text-align:right}
.lotes tr.f{cursor:pointer;transition:background .15s}
.lotes tr.f:hover td,.lotes tr.f.on td{background:rgba(200,178,138,.08)}
.lotes td:first-child{padding-left:6px}
.lotes td:last-child{padding-right:6px;width:28px}
.lotes .p{font-weight:600}
.lotes a{color:var(--champ);text-decoration:none}
.ley{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:11.5px;color:var(--muted)}
.ley span{display:inline-flex;align-items:center;gap:7px}
.ley i{width:12px;height:10px;border-radius:2px;display:inline-block}
.ley i.d{background:rgba(200,178,138,.55);box-shadow:inset 0 0 0 1px var(--champ)}
.ley i.o{box-shadow:inset 0 0 0 1px rgba(255,255,255,.7)}
.ley i.a{background:rgba(120,170,120,.35);box-shadow:inset 0 0 0 1px rgba(160,200,160,.7)}
.pie{padding-block:24px calc(24px + env(safe-area-inset-bottom,0px));font-size:11px;color:var(--dim)}

/* mapa */
.mapa-wrap{position:relative;min-width:0;min-height:0;overflow:hidden}
#mapa{position:absolute;inset:0;background:#0c0f0c;z-index:0;isolation:isolate}
.mapa-wrap::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:450;background:radial-gradient(120% 90% at 50% 45%,transparent 60%,rgba(0,0,0,.4) 100%)}
.leaflet-tile-pane{filter:brightness(.8) contrast(1.08) saturate(.85)}
.leaflet-container{font-family:var(--f-body);background:#0c0f0c}
.leaflet-control-attribution{background:rgba(0,0,0,.55)!important;color:#8d8a84!important;font-size:10px}
.leaflet-control-attribution a{color:#b8b4ac!important}
.leaflet-bar{border:1px solid var(--line-2)!important;box-shadow:none!important;border-radius:999px!important;overflow:hidden}
.leaflet-bar a{background:var(--glass)!important;color:var(--fg)!important;border-bottom:1px solid var(--line)!important;width:36px!important;height:36px!important;line-height:36px!important}
.leaflet-bar a:last-child{border-bottom:0!important}
#mp{position:absolute;inset:0;z-index:1;isolation:isolate;background:#0c0c0c}
#mp .leaflet-control-attribution{display:none}
.ayuda-mp{position:absolute;z-index:600;left:50%;transform:translateX(-50%);bottom:18px;background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);color:var(--fg);font-size:10.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;padding:8px 14px;border-radius:999px;white-space:nowrap;pointer-events:none;transition:opacity .4s}
.ayuda-mp.fuera{opacity:0}
.vista{position:absolute;z-index:600;top:16px;right:16px;display:flex;gap:2px;background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line-2);border-radius:999px;padding:3px}
.vista button{background:none;border:0;border-radius:999px;padding:7px 14px;font-size:10.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);cursor:pointer}
.vista button[aria-pressed="true"]{background:var(--fg);color:var(--ink)}
.ico{background:none;border:0}
.dev-pin{position:absolute;left:0;top:0;transform:translate(-21px,-21px);display:flex;align-items:center;gap:10px;white-space:nowrap;pointer-events:none}
.dev-pin .ic{width:42px;height:42px;flex:none;display:grid;place-items:center;background:var(--champ);color:#0a0a0a;border-radius:10px;transform:rotate(45deg);box-shadow:0 0 0 2px rgba(255,255,255,.9),0 0 0 8px rgba(200,178,138,.28),0 6px 16px rgba(0,0,0,.55)}
.dev-pin .ic svg{transform:rotate(-45deg);width:20px;height:20px}
.dev-pin .n{font-family:var(--f-display);font-style:italic;font-size:20px;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.9),0 0 12px rgba(0,0,0,.8)}
.lugar{position:absolute;left:0;top:0;transform:translate(-5px,-5px);display:flex;align-items:center;gap:7px;white-space:nowrap;pointer-events:none}
.lugar i{width:9px;height:9px;background:#fff;transform:rotate(45deg);box-shadow:0 0 0 2px rgba(10,10,10,.85);flex:none}
.lugar span{font-size:10.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.95),0 0 10px rgba(0,0,0,.8)}
.lugar b{font-weight:600;color:var(--champ)}
.amen-pin{position:absolute;left:0;top:0;transform:translate(-6px,-6px);display:flex;align-items:center;gap:7px;white-space:nowrap;pointer-events:none}
.amen-pin i{width:11px;height:11px;background:var(--champ);transform:rotate(45deg);box-shadow:0 0 0 2px rgba(10,10,10,.85),0 2px 6px rgba(0,0,0,.5);flex:none}
.amen-pin span{font-size:10.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.95),0 0 10px rgba(0,0,0,.8)}
.n-lote{font-size:10px;font-weight:700;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.95);transform:translate(-50%,-50%);position:absolute;white-space:nowrap;pointer-events:none}
.n-lote.d{color:#0a0a0a;text-shadow:none;background:var(--champ);border-radius:4px;padding:1px 5px}
.sin-num .n-lote:not(.d){display:none}
.pin-lote{position:absolute;left:0;top:0;transform:translate(-8px,-8px);width:16px;height:16px;border-radius:50%;background:var(--champ);box-shadow:0 0 0 2px rgba(255,255,255,.9),0 3px 8px rgba(0,0,0,.5);cursor:pointer}
.pin-lote.on{transform:translate(-8px,-8px) scale(1.35)}
.leaflet-tooltip.tt{background:#0d0d0d;color:var(--fg);border:1px solid var(--line-2);border-radius:8px;padding:8px 11px;box-shadow:0 10px 30px rgba(0,0,0,.55);font-family:var(--f-body);font-size:12.5px;line-height:1.35}
.leaflet-tooltip.tt::before{display:none}
.tt b{display:block;font-family:var(--f-display);font-size:18px;font-weight:500}
.tt span{color:var(--muted)}
.leaflet-popup.pop .leaflet-popup-content-wrapper{background:#0d0d0d;color:var(--fg);border:1px solid var(--line-2);border-radius:10px;padding:0;overflow:hidden;box-shadow:0 18px 50px rgba(0,0,0,.65)}
.leaflet-popup.pop .leaflet-popup-content{margin:0;width:250px!important;line-height:1.4}
.leaflet-popup.pop .leaflet-popup-tip{background:#0d0d0d}
.pop img{width:100%;aspect-ratio:16/10;object-fit:cover;display:block}
.pop .c{padding:12px 14px 14px;display:grid;gap:6px}
.pop .k{font-size:10px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--champ)}
.pop .pr{font-family:var(--f-display);font-size:22px;line-height:1}
.pop .s{font-size:12.5px;color:var(--muted)}
.pop .bb{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:4px}
.pop .bb a{display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;font-size:10.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;padding:9px 6px;border-radius:8px}
.pop .bb a:first-child{background:var(--fg);color:var(--ink)}
.pop .bb a+a{border:1px solid var(--line-2)}

.top,.hoja{display:none}
@media (max-width:899px){
  .app{display:block;height:100%}
  .panel{display:none}
  .mapa-wrap{position:fixed;inset:0}
  .leaflet-control-zoom{display:none}
  .top{display:flex;flex-direction:column;align-items:center;position:absolute;z-index:600;left:0;right:0;top:0;padding-top:calc(14px + env(safe-area-inset-top,0px));padding-inline:16px;pointer-events:none;text-shadow:0 1px 2px rgba(0,0,0,.85),0 0 18px rgba(0,0,0,.6)}
  .top .esquinas{position:absolute;left:10px;right:10px;top:calc(8px + env(safe-area-inset-top,0px));display:flex;justify-content:space-between;align-items:center;pointer-events:auto}
  .top .esquinas .volver{font-size:18px;padding:6px 8px;color:#fff;line-height:1}
  .top .idiomas button{color:rgba(255,255,255,.6);font-size:10px;padding:6px 4px}
  .top .idiomas button[aria-pressed="true"]{color:#fff}
  .top .kicker{margin-top:44px;font-size:9.5px;letter-spacing:.2em;text-align:center}
  .top h2{font-family:var(--f-display);font-style:italic;font-weight:500;font-size:32px;line-height:1;margin:4px 0 0;color:#fff;text-align:center;text-wrap:balance;max-width:86%}
  .top .raya{display:block;width:72px;height:1px;margin:12px 0 0;background:var(--champ)}
  .vista{top:auto;right:auto;left:50%;transform:translateX(-50%);bottom:calc(var(--hoja-min) + 14px + env(safe-area-inset-bottom,0px))}
  :root{--hoja-min:150px}
  .leaflet-bottom{bottom:calc(var(--hoja-min) + env(safe-area-inset-bottom,0px))}
  .ayuda-mp{bottom:auto;top:calc(138px + env(safe-area-inset-top,0px))}
  .hoja{display:block;position:absolute;z-index:700;left:0;right:0;bottom:0;height:calc(100% - 150px - env(safe-area-inset-top,0px));background:rgba(12,12,12,.97);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line-2);border-radius:18px 18px 0 0;box-shadow:0 -20px 50px rgba(0,0,0,.55);transform:translateY(calc(100% - var(--hoja-min) - env(safe-area-inset-bottom,0px)));transition:transform .35s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column}
  .hoja.abierta{transform:none}
  .hoja .asa{flex:none;display:grid;gap:10px;padding:10px 16px 14px;cursor:pointer;touch-action:none}
  .hoja .asa::before{content:"";justify-self:center;width:40px;height:4px;border-radius:2px;background:rgba(255,255,255,.3)}
  .hoja .resumen{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
  .hoja .resumen b{font-family:var(--f-display);font-style:italic;font-weight:500;font-size:22px;white-space:nowrap}
  .hoja .resumen span{font-size:10.5px;color:var(--champ);font-weight:600;letter-spacing:.12em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
  .hoja .acciones{margin:0}
  .hoja .cuerpo{overflow:auto;flex:1;padding:0 16px calc(24px + env(safe-area-inset-bottom,0px));overscroll-behavior:contain}
  .hoja .pad{padding-inline:0}
  .hoja h1{display:none}
  .hoja .portada{padding-top:4px}
  .amen{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<!--CUERPO-->
<div class="app">
  <aside class="panel" id="panel"></aside>
  <main class="mapa-wrap">
    <div id="mapa" aria-label="Ubicación del desarrollo sobre el satélite"></div>
    <div id="mp" aria-label="Masterplan del desarrollo" hidden></div>
    <span class="ayuda-mp" id="ayuda-mp" hidden></span>
    <div class="vista" id="vista" role="group"></div>
    <div class="top">
      <div class="esquinas"><a class="volver" id="volver-m" href="__RAIZ__#desarrollos" aria-label="Desarrollos">←</a><div class="idiomas" id="idiomas-m"></div></div>
      <span class="kicker" id="kicker-m"></span>
      <h2 id="nombre-m"></h2>
      <span class="raya" aria-hidden="true"></span>
    </div>
    <section class="hoja" id="hoja" aria-label="El proyecto">
      <div class="asa" id="asa"></div>
      <div class="cuerpo" id="cuerpo-m"></div>
    </section>
  </main>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
/*__COMUN__*/
</script>
<script>
const DATOS = /*__DATOS__*/null;
const DEV = DATOS.desarrollo, PL = DATOS.plano, MP = DATOS.masterplan;
const LOTES = []; /* la página presenta el proyecto: no lista los lotes en venta */
cargarEstadisticas(DATOS.sitio);
const $ = id => document.getElementById(id);
const mapa = mapaBase("mapa");
const capaPlano = L.layerGroup().addTo(mapa), capaLugares = L.layerGroup().addTo(mapa);
let VISTA = "plano", actual = null;
const porRef = new Map(), filas = new Map();

const precio = l => l.precio ? `${mon(l.moneda)} ${fmt(l.precio)}` : t("consultar_precio");
const m2 = n => n ? `${fmt(n)} m²` : "—";
const nLote = l => l.lote_plano || l.lote || "";

/* ---------- textos del panel (compu) y de la hoja (celular) ---------- */
function htmlCuerpo(conTitulo) {
  const fotos = DEV.fotos || [], est = [tl(DEV.estado), DEV.entrega ? `${t("entrega")} ${DEV.entrega}` : ""].filter(Boolean).join(" · ");
  const lotesPlano = PL && PL.lotes.length, ha = PL && PL.ha;
  const fijas = (DATOS.cifras || []).map(c => [tl(c.valor) || c.valor, tl(c.nombre)]);
  const cif = [
    ...(fijas.length ? fijas : [ha ? [fmt(ha), t("hectareas")] : null, lotesPlano ? [lotesPlano, t("lotes")] : null]),
  ].filter(Boolean).slice(0, 6);
  const amen = (DATOS.amenities || []).map(tl).filter(Boolean);
  const vent = (DATOS.ventajas || []).map(tl).filter(Boolean);
  const texto = tl(DATOS.bajada);
  return `<div class="portada pad">
      ${conTitulo ? `<span class="kicker">${iconoDev(DEV)}${esc(claseDev(DEV))}${DATOS.zona ? " · " + esc(DATOS.zona) : ""}</span><h1>${esc(DEV.nombre)}</h1>` : ""}
      ${est ? `<span class="estado">${esc(est)}</span>` : ""}
      ${fotos.length ? `<div class="galeria"><div class="pista">${fotos.map((f, k) => `<img src="${esc(f)}" alt="" ${k ? 'loading="lazy"' : ""}>`).join("")}</div>
        ${fotos.length > 1 ? `<button class="flecha ant" type="button" aria-label="‹">‹</button><button class="flecha sig" type="button" aria-label="›">›</button><span class="cont">1 / ${fotos.length}</span>` : ""}</div>` : ""}
      ${cif.length ? `<div class="cifras${cif.length % 2 ? "" : " par"}">${cif.map(([v, n]) => `<div class="cifra"><b>${esc(v)}</b><span>${esc(n)}</span></div>`).join("")}</div>` : ""}
      ${conTitulo ? htmlAcciones() : ""}
    </div>
    ${texto ? `<section class="sec pad"><h2>${t("el_proyecto")}</h2><p class="texto corto">${esc(texto)}</p><button class="mas" type="button">${t("ver_mas")}</button></section>` : ""}
    ${vent.length ? `<section class="sec pad"><h2>${t("ventajas")}</h2><ol class="ventajas">${vent.map(v => `<li>${esc(v)}</li>`).join("")}</ol></section>` : ""}
    ${amen.length ? `<section class="sec pad"><h2>${t("amenities")}</h2><ul class="amen">${amen.map(v => `<li>${esc(v)}</li>`).join("")}</ul></section>` : ""}
    ${(DATOS.cerca || []).length ? `<section class="sec pad"><h2>${t("ubicacion")}</h2><ul class="cerca">${DATOS.cerca.map(l =>
        `<li><span>${esc(tl(l.nombre))}</span><b>${fmtKm(l.km)}</b></li>`).join("")}</ul><span class="nota">${t("linea_recta")}</span>
        <button class="mas" type="button" data-vista="zona">${t("ver_en_mapa")} →</button></section>` : ""}
    ${LOTES.length ? `<section class="sec pad"><h2>${t("lotes_venta")}</h2>
        ${PL && PL.lotes.length ? `<div class="ley"><span><i class="d"></i>${t("disponible")}</span><span><i class="o"></i>${t("otros_lotes")}</span>${PL.areas.length ? `<span><i class="a"></i>${t("areas_comunes")}</span>` : ""}</div>` : ""}
        <table class="lotes"><thead><tr><th>${t("lote")}</th><th>${t("superficie_l")}</th><th>${t("precio")}</th><th></th></tr></thead>
        <tbody>${LOTES.map(l => `<tr class="f" data-ref="${esc(l.ref)}" tabindex="0"><td>${esc(nLote(l) || "—")}</td><td>${m2(l.m2_terreno)}</td><td class="p">${esc(precio(l))}</td>
          <td><a href="${esc(l.url)}" target="_blank" rel="noopener" aria-label="${t("ver_ficha")}">↗</a></td></tr>`).join("")}</tbody></table></section>` : ""}
    ${!conTitulo ? `<section class="sec pad">${htmlAcciones()}</section>` : ""}
    <div class="pie pad">${t("pie")}</div>`;
}
function htmlAcciones(sinKmz) {
  const b = [];
  if (DATOS.brochure) b.push(`<a class="b-pri" href="${esc(DATOS.brochure)}" target="_blank" rel="noopener" data-ev="brochure">${ICONO_DOC}${t("brochure_b")}</a>`);
  b.push(`<a class="b-${DATOS.brochure ? "sec" : "pri"}" href="${esc(waDev(DEV))}" target="_blank" rel="noopener" data-ev="whatsapp-dev">${ICONO_WA}${t("consultar")}</a>`);
  if (DATOS.kmz && !sinKmz) b.push(`<a class="b-sec ancho" href="${esc(DATOS.kmz)}" download data-ev="kmz">${t("bajar_kmz")}</a>`);
  if (!DATOS.brochure && DEV.url && !/coldwellbankerzetate\.com\/?$/.test(DEV.url)) b.push(`<a class="b-sec" href="${esc(DEV.url)}" target="_blank" rel="noopener">${t("brochure")} ↗</a>`);
  if (b.length === 1) b[0] = b[0].replace('class="b-', 'class="ancho b-');
  return `<div class="acciones">${b.join("")}</div>`;
}
const fmtKm = k => k < 10 ? `${String(k).replace(".", LANG === "en" ? "." : ",")} km` : `${Math.round(k)} km`;
const ICONO_DOC = '<svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" d="M6 3h8l4 4v14H6zM14 3v4h4M9 12h6M9 16h6"/></svg>';

function enganchar(raiz) {
  const g = raiz.querySelector(".pista"), n = (DEV.fotos || []).length;
  if (g && n > 1) {
    const paso = d => g.scrollBy({ left: d * g.clientWidth, behavior: "smooth" });
    raiz.querySelector(".ant").onclick = () => paso(-1);
    raiz.querySelector(".sig").onclick = () => paso(1);
    g.addEventListener("scroll", () => { raiz.querySelector(".cont").textContent = `${Math.round(g.scrollLeft / g.clientWidth) + 1} / ${n}`; }, { passive: true });
  }
  raiz.querySelectorAll(".mas:not([data-vista])").forEach(b => {
    const tx = b.previousElementSibling;
    b.hidden = tx.scrollHeight <= tx.clientHeight + 2;
    b.onclick = () => { const c = tx.classList.toggle("corto"); b.textContent = c ? t("ver_mas") : t("ver_menos"); };
  });
  raiz.querySelectorAll("[data-vista]").forEach(b => b.onclick = () => { ponerVista(b.dataset.vista); cerrarHoja(); });
  raiz.querySelectorAll("[data-ev]").forEach(a => a.addEventListener("click", () => track(a.dataset.ev + "/" + DEV.slug)));
  raiz.querySelectorAll("tr.f").forEach(tr => {
    const ref = tr.dataset.ref;
    (filas.get(ref) || filas.set(ref, []).get(ref)).push(tr);
    tr.addEventListener("mouseenter", () => resaltar(ref, true));
    tr.addEventListener("mouseleave", () => resaltar(ref, false));
    const ir = e => { if (e.target.closest("a")) return; irALote(ref); cerrarHoja(); };
    tr.addEventListener("click", ir);
    tr.addEventListener("keydown", e => { if (e.key === "Enter") ir(e); });
  });
}
function pintar() {
  filas.clear();
  document.title = `${DEV.nombre} · ${t("desarrollos")} · Coldwell Banker Zetaté`;
  $("panel").innerHTML = `<div class="barra-sup pad"><a class="volver" href="${DATOS.raiz}#desarrollos">← ${t("todos_desarrollos")}</a><div class="idiomas" id="idiomas-p"></div></div>
    <div class="logo-wrap pad"><img class="logo" src="${DATOS.raiz}assets/logo-apilado.png" alt="Coldwell Banker Zetaté" width="210" height="44"></div>` + htmlCuerpo(true);
  $("kicker-m").textContent = claseDev(DEV);
  $("nombre-m").textContent = DEV.nombre;
  const res = (DATOS.cifras || []).slice(0, 2).map(c => `${tl(c.valor) || c.valor} ${tl(c.nombre).split(" ")[0]}`).join(" · ");
  $("asa").innerHTML = `<div class="resumen"><b>${t("el_proyecto")}</b><span>${esc(res)}</span></div>${htmlAcciones(true)}`;
  $("cuerpo-m").innerHTML = htmlCuerpo(false);
  armarIdiomas($("idiomas-p"), todo);
  enganchar($("panel")); enganchar($("cuerpo-m")); enganchar($("asa"));
  $("vista").innerHTML = [...(MP ? [["mp", t("masterplan")]] : []), ["plano", t(MP ? "satelite" : "plano")], ["zona", t("ubicacion")]].map(([k, x]) => `<button type="button" data-k="${k}" aria-pressed="${VISTA === k}">${x}</button>`).join("");
  $("vista").querySelectorAll("button").forEach(b => b.onclick = () => ponerVista(b.dataset.k));
}

/* ---------- plano (KMZ) sobre el satélite ---------- */
const capasLote = new Map();
function dibujarPlano() {
  capaPlano.clearLayers(); capasLote.clear();
  const disp = new Map(LOTES.filter(l => l.lote_plano).map(l => [String(l.lote_plano), l]));
  if (PL) {
    if (PL.perimetro) L.polygon(PL.perimetro, { color: "#c8b28a", weight: 2.5, fill: false, interactive: false }).addTo(capaPlano);
    PL.areas.forEach(a => L.polygon(a.c, { color: "rgba(170,210,170,.85)", weight: 1, fillColor: "#6fa56f", fillOpacity: .28 })
      .bindTooltip(`<b>${esc(a.nombre)}</b>${a.m2 > 5000 ? `<span>${fmt(a.m2 / 10000)} ha</span>` : ""}`, { className: "tt", sticky: true }).addTo(capaPlano));
    PL.lineas.forEach(l => L.polyline(l.c, { color: "rgba(255,255,255,.55)", weight: 1.5, interactive: false }).addTo(capaPlano));
    PL.lotes.forEach(lt => {
      const u = disp.get(String(lt.n)) || (lt.ref && LOTES.find(x => x.ref === lt.ref));
      const pol = L.polygon(lt.c, u ? { color: "#c8b28a", weight: 1.5, fillColor: "#c8b28a", fillOpacity: .5 }
                                    : { color: "rgba(255,255,255,.6)", weight: .8, fillColor: "#fff", fillOpacity: .04 }).addTo(capaPlano);
      pol.bindTooltip(u ? `<b>${t("lote")} ${esc(lt.n)} · ${esc(precio(u))}</b><span>${m2(u.m2_terreno || lt.m2)}</span>`
                        : `<b>${t("lote")} ${esc(lt.n)}</b><span>${m2(lt.m2)}${LOTES.length ? " · " + t("consultar") : ""}</span>`, { className: "tt", sticky: true });
      const c = pol.getBounds().getCenter();
      L.marker(c, { interactive: false, keyboard: false, icon: L.divIcon({ className: "ico", iconSize: [0, 0], html: `<span class="n-lote${u ? " d" : ""}">${esc(lt.n)}</span>` }) }).addTo(capaPlano);
      if (u) { capasLote.set(u.ref, pol); pol.on("click", () => abrirLote(u, c)); pol.on("mouseover", () => resaltar(u.ref, true)); pol.on("mouseout", () => resaltar(u.ref, false)); }
    });
    PL.puntos.forEach(p => L.marker([p.lat, p.lng], { interactive: false, keyboard: false,
      icon: L.divIcon({ className: "ico", iconSize: [0, 0], html: `<span class="amen-pin"><i></i><span>${esc(p.nombre)}</span></span>` }) }).addTo(capaPlano));
  }
  /* lotes en venta que no están en el plano (o no hay KMZ): punto champagne */
  LOTES.filter(l => !capasLote.has(l.ref)).forEach(l => {
    const m = L.marker([l.lat, l.lng], { keyboard: false, icon: L.divIcon({ className: "ico", iconSize: [0, 0], html: `<span class="pin-lote" data-ref="${esc(l.ref)}"></span>` }) }).addTo(capaPlano);
    m.bindTooltip(`<b>${esc(precio(l))}</b><span>${m2(l.m2_terreno)}${nLote(l) ? " · " + t("lote") + " " + esc(nLote(l)) : ""}</span>`, { className: "tt", direction: "top", offset: [0, -10] });
    m.on("click", () => abrirLote(l, m.getLatLng()));
    m.on("mouseover", () => resaltar(l.ref, true)); m.on("mouseout", () => resaltar(l.ref, false));
    capasLote.set(l.ref, m);
  });
  if (!PL || !PL.perimetro) L.marker([DEV.lat, DEV.lng], { interactive: false, keyboard: false, zIndexOffset: -500,
    icon: L.divIcon({ className: "ico", iconSize: [0, 0], html: `<span class="dev-pin"><span class="ic">${iconoDev(DEV)}</span><span class="n">${LOTES.length ? "" : esc(DEV.nombre)}</span></span>` }) }).addTo(capaPlano);
  capaLugares.clearLayers();
  (DATOS.cerca || []).forEach(l => {
    L.polyline([[DEV.lat, DEV.lng], [l.lat, l.lng]], { color: "rgba(200,178,138,.55)", weight: 1, dashArray: "4 6", interactive: false }).addTo(capaLugares);
    L.marker([l.lat, l.lng], { interactive: false, keyboard: false, icon: L.divIcon({ className: "ico", iconSize: [0, 0],
      html: `<span class="lugar"><i></i><span>${esc(tl(l.nombre))} <b>${fmtKm(l.km)}</b></span></span>` }) }).addTo(capaLugares);
  });
}
function resaltar(ref, on) {
  (filas.get(ref) || []).forEach(tr => tr.classList.toggle("on", on));
  const c = capasLote.get(ref); if (!c) return;
  if (c.setStyle) c.setStyle({ fillOpacity: on ? .85 : .5, weight: on ? 2.5 : 1.5 });
  else c.getElement()?.querySelector(".pin-lote")?.classList.toggle("on", on);
}
const popLote = L.popup({ className: "pop", closeButton: false, offset: [0, -6], autoPanPaddingTopLeft: L.point(16, movil() ? 150 : 20), autoPanPaddingBottomRight: L.point(16, movil() ? 200 : 20) });
function abrirLote(l, donde) {
  popLote.setLatLng(donde).setContent(`${l.foto ? `<img src="${esc(l.foto)}" alt="">` : ""}<div class="c">
    <span class="k">${nLote(l) ? t("lote") + " " + esc(nLote(l)) + " · " : ""}${m2(l.m2_terreno)}</span><span class="pr">${esc(precio(l))}</span>
    ${l.titulo ? `<span class="s">${esc(l.titulo)}</span>` : ""}
    <div class="bb"><a href="${esc(l.url)}" target="_blank" rel="noopener">${t("ver_ficha")}</a><a href="${esc(linkWA({ ...l, ops: [], barrio_nombre: DEV.nombre }))}" target="_blank" rel="noopener">${ICONO_WA}WhatsApp</a></div></div>`).openOn(mapa);
  track("lote/" + l.ref);
}
function irALote(ref) {
  const c = capasLote.get(ref), l = LOTES.find(x => x.ref === ref); if (!c || !l) return;
  const donde = c.getBounds ? c.getBounds().getCenter() : c.getLatLng();
  if (VISTA !== "plano") ponerVista("plano", true);
  mapa.flyTo(donde, Math.max(mapa.getZoom(), 17), { duration: .8 });
  mapa.once("moveend", () => abrirLote(l, donde));
}
function encuadrePlano() {
  const pts = PL ? [...(PL.perimetro || []), ...PL.lotes.flatMap(l => l.c)] : [];
  LOTES.forEach(l => pts.push([l.lat, l.lng]));
  if (!pts.length) pts.push([DEV.lat, DEV.lng]);
  return L.latLngBounds(pts);
}
const pad = () => movil() ? { paddingTopLeft: [24, 150], paddingBottomRight: [24, 230] } : { paddingTopLeft: [60, 60], paddingBottomRight: [60, 60] };
function ponerVista(k, sinMover) {
  VISTA = k;
  $("vista").querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.k === k)));
  $("mp").hidden = k !== "mp"; $("ayuda-mp").hidden = k !== "mp";
  if (k === "mp") { armarMasterplan(); track("vista/mp"); return; }
  mapa.invalidateSize();
  if (k === "zona") { capaLugares.addTo(mapa); if (!sinMover) mapa.flyToBounds(encuadrePlano().extend(L.latLngBounds(DATOS.cerca.map(l => [l.lat, l.lng]))), { ...pad(), duration: 1 }); }
  else { mapa.removeLayer(capaLugares); if (!sinMover) mapa.flyToBounds(encuadrePlano(), { ...pad(), maxZoom: 17, duration: 1 }); }
  track("vista/" + k);
}
mapa.on("zoomend", () => mapa.getContainer().classList.toggle("sin-num", mapa.getZoom() < 16.5));

/* ---------- hoja (celular) ---------- */
const hoja = $("hoja");
function cerrarHoja() { hoja.classList.remove("abierta"); }
$("asa").addEventListener("click", e => { if (!e.target.closest("a,button")) hoja.classList.toggle("abierta"); });
let y0 = null;
$("asa").addEventListener("touchstart", e => { y0 = e.touches[0].clientY; }, { passive: true });
$("asa").addEventListener("touchend", e => {
  if (y0 == null) return; const dy = e.changedTouches[0].clientY - y0; y0 = null;
  if (dy < -30) hoja.classList.add("abierta"); else if (dy > 30) cerrarHoja();
});

/* ---------- masterplan (imagen del plano, con zoom) ---------- */
let mpMapa = null;
function armarMasterplan() {
  if (mpMapa) { mpMapa.invalidateSize(); return; }
  mpMapa = L.map("mp", { crs: L.CRS.Simple, zoomControl: !movil(), attributionControl: false, zoomSnap: 0.1, minZoom: -5, maxZoom: 1, bounceAtZoomLimits: false });
  if (mpMapa.zoomControl) mpMapa.zoomControl.setPosition("bottomright");
  const img = new Image();
  img.onload = () => {
    const b = [[0, 0], [img.naturalHeight, img.naturalWidth]];
    L.imageOverlay(MP, b).addTo(mpMapa);
    const encuadre = () => mpMapa.fitBounds(b, { padding: movil() ? [8, 8] : [30, 30], paddingTopLeft: movil() ? [8, 150] : [30, 80], paddingBottomRight: movil() ? [8, 280] : [30, 30] });
    encuadre();
    mpMapa.setMinZoom(mpMapa.getZoom() - .5);
    mpMapa.setMaxBounds(L.latLngBounds(b).pad(.25));
    mpMapa.once("zoomstart dragstart", () => $("ayuda-mp").classList.add("fuera"));
  };
  img.src = MP;
}

function todo() { pintar(); dibujarPlano(); if (VISTA === "zona") capaLugares.addTo(mapa); else mapa.removeLayer(capaLugares); if (MP) $("ayuda-mp").textContent = t(tactil ? "ayuda_mp_t" : "ayuda_mp"); }
armarIdiomas($("idiomas-m"), todo);
todo();
mapa.fitBounds(encuadrePlano(), { ...pad(), maxZoom: PL ? 17 : 15.5 });
if (MP) ponerVista("mp");
mapa.getContainer().classList.toggle("sin-num", mapa.getZoom() < 16.5);
window.addEventListener("resize", () => { mapa.invalidateSize(); mpMapa?.invalidateSize(); });
</script>
