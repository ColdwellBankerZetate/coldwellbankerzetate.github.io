<title>__TITULO__</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,500;1,6..96,500&family=Hanken+Grotesk:wght@400;500;600;700&display=swap">
<style>
/*__LEAFLET_CSS__*/
</style>
<style>
/* Portada: panel negro con los barrios + satélite de la zona; en celular, mapa y tira de barrios abajo. */
:root{
  --ink:#0a0a0a; --panel:#101010; --raise:#181818; --glass:rgba(12,12,12,.72);
  --line:rgba(255,255,255,.09); --line-2:rgba(255,255,255,.18);
  --fg:#f3f1ec; --muted:#9b978f; --dim:#6d6a64; --champ:#c8b28a;
  --venta:#e3141e; --temporada:#c8b28a; --alquiler:#f3f1ec;
  --f-display:"Bodoni Moda","Didot","Bodoni 72",Georgia,serif;
  --f-body:"Hanken Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--ink);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
a{color:inherit}
.app{display:grid;grid-template-columns:minmax(360px,440px) 1fr;height:100%}
.panel{display:flex;flex-direction:column;min-height:0;min-width:0;background:var(--panel);border-right:1px solid var(--line)}
.head{display:grid;gap:14px;padding-block:18px 18px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:28px}
.barra-sup{display:flex;justify-content:flex-end}
.idiomas{display:flex;gap:2px}
.idiomas button{background:none;border:0;padding:4px 6px;font-size:11px;font-weight:600;letter-spacing:.14em;color:var(--dim);cursor:pointer}
.idiomas button[aria-pressed="true"]{color:var(--fg);text-decoration:underline;text-decoration-color:var(--venta);text-underline-offset:5px;text-decoration-thickness:2px}
.logo-wrap{display:flex;justify-content:center;padding-block:8px 20px;border-bottom:1px solid var(--line)}
.logo{display:block;height:46px;width:auto;max-width:100%}
h1{font-family:var(--f-display);font-style:italic;font-weight:500;font-size:42px;line-height:1.02;margin:8px 0 0;text-wrap:balance}
.bajada{margin:0;color:var(--muted);font-size:14px;max-width:46ch}
.stats{display:flex;gap:28px;padding-top:14px;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
.stat{display:grid;gap:2px}
.stat b{font-size:20px;font-weight:600}
.stat span{font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim)}
.lista{list-style:none;margin:0;padding-block:6px 28px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:28px;display:grid;gap:14px;overflow:auto;min-height:0;scrollbar-width:thin;scrollbar-color:var(--line-2) transparent}
.bc{display:grid;grid-template-columns:120px 1fr;gap:14px;align-items:center;text-decoration:none;border-radius:6px;padding:6px;margin:-6px;transition:background .15s}
.bc:hover,.bc.on{background:var(--raise)}
.bc img{width:120px;height:84px;object-fit:cover;border-radius:4px;display:block;background:var(--raise)}
.bc .tx{display:grid;gap:3px;min-width:0}
.bc .n{font-family:var(--f-display);font-style:italic;font-size:23px;line-height:1.05}
.bc .z{font-size:12.5px;color:var(--muted)}
.bc .ops{display:flex;gap:10px;flex-wrap:wrap;font-size:10.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.bc .ops span{display:inline-flex;align-items:center;gap:5px}
.bc .ops i{width:6px;height:6px;border-radius:50%}
i.venta{background:var(--venta)}i.temporada{background:var(--temporada)}i.alquiler{background:var(--alquiler)}
.pie{padding-block:12px 16px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:28px;border-top:1px solid var(--line);font-size:11px;color:var(--dim)}
.mapa-wrap{position:relative;min-width:0;min-height:0;overflow:hidden}
#mapa{position:absolute;inset:0;background:#0c0f0c}
.mapa-wrap::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:450;background:radial-gradient(120% 90% at 50% 45%,transparent 55%,rgba(0,0,0,.45) 100%)}
.leaflet-tile-pane{filter:brightness(.78) contrast(1.08) saturate(.85)}
.leaflet-container{font-family:var(--f-body);background:#0c0f0c}
.leaflet-control-attribution{background:rgba(0,0,0,.55)!important;color:#8d8a84!important;font-size:10px}
.leaflet-control-attribution a{color:#b8b4ac!important}
.leaflet-bar{border:1px solid var(--line-2)!important;box-shadow:none!important;border-radius:999px!important;overflow:hidden}
.leaflet-bar a{background:var(--glass)!important;color:var(--fg)!important;border-bottom:1px solid var(--line)!important;width:36px!important;height:36px!important;line-height:36px!important}
.leaflet-bar a:last-child{border-bottom:0!important}
.bm-icon{background:none;border:0}
.bm{position:absolute;left:0;top:0;transform:translate(-17px,-17px);display:flex;align-items:center;gap:9px;text-decoration:none;white-space:nowrap}
.bm .c{width:34px;height:34px;border-radius:50%;background:var(--venta);color:#fff;display:grid;place-items:center;font-size:13px;font-weight:700;box-shadow:0 0 0 2px rgba(255,255,255,.9),0 4px 12px rgba(0,0,0,.55);flex:none;font-variant-numeric:tabular-nums;transition:transform .2s}
.bm .l{font-family:var(--f-display);font-style:italic;font-size:17px;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.9),0 0 12px rgba(0,0,0,.8);transition:opacity .2s}
.bm.sin-tag .l{opacity:0}
.bm:hover .c,.bm.on .c{transform:scale(1.15)}
.bm:hover .l,.bm.on .l{opacity:1}
.top,.tira{display:none}
@media (max-width:899px){
  .app{display:block;height:100%}
  .panel{display:none}
  .mapa-wrap{position:fixed;inset:0}
  .leaflet-control-zoom{display:none}
  .top{display:flex;flex-direction:column;align-items:center;position:absolute;z-index:600;left:0;right:0;top:0;padding-top:calc(18px + env(safe-area-inset-top,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));pointer-events:none;text-shadow:0 1px 2px rgba(0,0,0,.85),0 0 18px rgba(0,0,0,.6)}
  .top .idiomas{position:absolute;right:max(10px,env(safe-area-inset-right,0px));top:calc(10px + env(safe-area-inset-top,0px));pointer-events:auto}
  .top .idiomas button{color:rgba(255,255,255,.6);font-size:10px;padding:6px 4px}
  .top .idiomas button[aria-pressed="true"]{color:#fff}
  .top img{height:15px;width:auto;margin-top:14px;filter:drop-shadow(0 1px 3px rgba(0,0,0,.8))}
  .top h2{font-family:var(--f-display);font-style:italic;font-weight:500;font-size:28px;line-height:1.05;margin:12px 0 0;color:#fff;text-align:center;text-wrap:balance}
  .top .raya{display:block;width:72px;height:1px;margin:12px 0 0;background:rgba(255,255,255,.85)}
  .tira{display:flex;gap:10px;position:absolute;z-index:620;left:0;right:0;bottom:calc(18px + env(safe-area-inset-bottom,0px));overflow-x:auto;scroll-snap-type:x mandatory;padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));scrollbar-width:none;margin:0;list-style:none}
  .tira::-webkit-scrollbar{display:none}
  .tira li{flex:0 0 78%;max-width:320px;scroll-snap-align:center}
  .tira .bc{margin:0;background:rgba(10,10,10,.88);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--line-2);border-radius:14px;padding:8px;grid-template-columns:92px 1fr;gap:12px;box-shadow:0 14px 40px rgba(0,0,0,.5)}
  .tira .bc img{width:92px;height:72px;border-radius:9px}
  .tira .bc .n{font-size:20px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<!--CUERPO-->
<div class="app">
  <aside class="panel">
    <header class="head">
      <div class="barra-sup"><div class="idiomas" id="idiomas-p"></div></div>
      <div class="logo-wrap"><img class="logo" src="assets/logo-apilado.png" alt="Coldwell Banker Zetaté" width="220" height="46"></div>
      <h1 id="titulo"></h1>
      <p class="bajada" id="bajada"></p>
      <div class="stats" id="stats"></div>
    </header>
    <ul class="lista" id="lista"></ul>
    <div class="pie" id="pie"></div>
  </aside>
  <main class="mapa-wrap">
    <div id="mapa" aria-label="Mapa satelital de la zona"></div>
    <div class="top"><div class="idiomas" id="idiomas-m"></div><img src="assets/logo-horizontal.png" alt="Coldwell Banker Zetaté" width="138" height="15"><h2 id="titulo-m"></h2><span class="raya" aria-hidden="true"></span></div>
    <ul class="tira" id="tira"></ul>
  </main>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
/*__COMUN__*/
</script>
<script>
const DATOS = /*__DATOS__*/null;
const B = DATOS.barrios;
cargarEstadisticas(DATOS.sitio);
const $ = id => document.getElementById(id);
const mapa = mapaBase("mapa");
const capa = L.layerGroup().addTo(mapa);
let items = [];

function card(b) {
  return `<a class="bc" href="${b.slug}/" data-slug="${b.slug}">${b.foto ? `<img src="${esc(b.foto)}" alt="" loading="lazy">` : `<img alt="">`}
    <span class="tx"><span class="n">${esc(b.nombre)}</span>
    <span class="z">${b.total} ${b.total === 1 ? t("propiedad") : t("propiedades_m")}${b.desde_venta ? ` · ${t("desde")} U$S ${corto(b.desde_venta)}` : ""}</span>
    <span class="ops">${b.ops.map(o => `<span><i class="${o}"></i>${t(o)}</span>`).join("")}</span></span></a>`;
}
function pintar() {
  $("titulo").textContent = t("portada_t"); $("titulo-m").textContent = t("portada_t");
  $("bajada").textContent = t("portada_b");
  $("stats").innerHTML = `<div class="stat"><b>${DATOS.total}</b><span>${t("propiedades")}</span></div><div class="stat"><b>${B.length}</b><span>${t("barrios")}</span></div>`;
  $("pie").textContent = t("pie");
  $("lista").innerHTML = B.map(b => `<li>${card(b)}</li>`).join("");
  $("tira").innerHTML = B.map(b => `<li>${card(b)}</li>`).join("");
  capa.clearLayers(); items = [];
  B.forEach(b => {
    const m = L.marker([b.lat, b.lng], { keyboard: false, icon: L.divIcon({ className: "bm-icon", iconSize: [0, 0],
      html: `<a class="bm" href="${b.slug}/" aria-label="${esc(b.nombre)}"><span class="c">${b.total}</span><span class="l tag">${esc(b.nombre)}</span></a>` }) }).addTo(capa);
    items.push({ b, m, visible: true, pinEl: () => m.getElement()?.querySelector(".bm") });
  });
  document.querySelectorAll(".bc").forEach(a => {
    const it = items.find(x => x.b.slug === a.dataset.slug);
    a.addEventListener("mouseenter", () => it.pinEl()?.classList.add("on"));
    a.addEventListener("mouseleave", () => it.pinEl()?.classList.remove("on"));
  });
  requestAnimationFrame(acomodar);
}
const acomodar = () => acomodarEtiquetas(items, it => it.b.total);
mapa.on("zoomend moveend", () => requestAnimationFrame(acomodar));
for (const id of ["idiomas-p", "idiomas-m"]) armarIdiomas($(id), pintar);
pintar();
const pad = movil() ? { paddingTopLeft: [24, 160], paddingBottomRight: [110, 170] } : { paddingTopLeft: [80, 80], paddingBottomRight: [230, 80] };
mapa.fitBounds(L.latLngBounds(B.map(b => [b.lat, b.lng])), pad);
/* celular: al deslizar la tira, el mapa resalta ese barrio */
const tira = $("tira");
tira.addEventListener("scroll", () => {
  const k = Math.round(tira.scrollLeft / (tira.firstElementChild?.offsetWidth + 10 || 1));
  items.forEach((it, j) => it.pinEl()?.classList.toggle("on", j === k));
}, { passive: true });
window.addEventListener("resize", () => mapa.invalidateSize());
</script>
