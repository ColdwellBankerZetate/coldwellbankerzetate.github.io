<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,500;1,6..96,500&family=Hanken+Grotesk:wght@400;500;600;700&display=swap">
<style>
/*__LEAFLET_CSS__*/
</style>
<style>
/* Portada: panel negro con los barrios + satélite de la zona; en celular, mapa y tira de barrios abajo. */
:root{
  --ink:#0a0a0a; --panel:#101010; --raise:#181818; --glass:rgba(12,12,12,.72);
  --line:rgba(255,255,255,.09); --line-2:rgba(255,255,255,.18);
  --fg:#f3f1ec; --muted:#9b978f; --dim:#6d6a64; --champ:#c8b28a;
  --venta:#e3141e; --temporada:#c8b28a; --alquiler:#f3f1ec;
  --f-display:"Bodoni Moda","Didot","Bodoni 72",Georgia,serif;
  --f-body:"Hanken Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--ink);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
a{color:inherit}
.app{display:grid;grid-template-columns:minmax(360px,440px) 1fr;height:100%}
.panel{display:flex;flex-direction:column;min-height:0;min-width:0;background:var(--panel);border-right:1px solid var(--line)}
.head{display:grid;gap:14px;padding-block:18px 18px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:28px}
.barra-sup{display:flex;justify-content:flex-end}
.idiomas{display:flex;gap:2px}
.idiomas button{background:none;border:0;padding:4px 6px;font-size:11px;font-weight:600;letter-spacing:.14em;color:var(--dim);cursor:pointer}
.idiomas button[aria-pressed="true"]{color:var(--fg);text-decoration:underline;text-decoration-color:var(--venta);text-underline-offset:5px;text-decoration-thickness:2px}
.logo-wrap{display:flex;justify-content:center;padding-block:8px 20px;border-bottom:1px solid var(--line)}
.logo{display:block;height:46px;width:auto;max-width:100%}
h1{font-family:var(--f-display);font-style:italic;font-weight:500;font-size:42px;line-height:1.02;margin:8px 0 0;text-wrap:balance}
.bajada{margin:0;color:var(--muted);font-size:14px;max-width:46ch}
.stats{display:flex;gap:28px;padding-top:14px;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
.stat{display:grid;gap:2px}
.stat b{font-size:20px;font-weight:600}
.stat span{font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim)}
.lista{flex:1;list-style:none;margin:0;padding-block:6px 28px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:28px;display:grid;gap:14px;overflow:auto;min-height:0;scrollbar-width:thin;scrollbar-color:var(--line-2) transparent}
.bc{display:grid;grid-template-columns:120px 1fr;gap:14px;align-items:center;text-decoration:none;border-radius:6px;padding:6px;margin:-6px;transition:background .15s}
.bc:hover,.bc.on{background:var(--raise)}
.bc img{width:120px;height:84px;object-fit:cover;border-radius:4px;display:block;background:var(--raise)}
.bc .tx{display:grid;gap:3px;min-width:0}
.bc .n{font-family:var(--f-display);font-style:italic;font-size:23px;line-height:1.05}
.bc .z{font-size:12.5px;color:var(--muted)}
.bc .ops{display:flex;gap:10px;flex-wrap:wrap;font-size:10.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.bc .ops span{display:inline-flex;align-items:center;gap:5px}
.bc .ops i{width:6px;height:6px;border-radius:50%}
i.venta{background:var(--venta)}i.temporada{background:var(--temporada)}i.alquiler{background:var(--alquiler)}
.pie{padding-block:12px 16px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:28px;border-top:1px solid var(--line);font-size:11px;color:var(--dim)}
.mapa-wrap{position:relative;min-width:0;min-height:0;overflow:hidden}
#mapa{position:absolute;inset:0;background:#0c0f0c}
.mapa-wrap::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:450;background:radial-gradient(120% 90% at 50% 45%,transparent 55%,rgba(0,0,0,.45) 100%)}
.leaflet-tile-pane{filter:brightness(.78) contrast(1.08) saturate(.85)}
.leaflet-container{font-family:var(--f-body);background:#0c0f0c}
.leaflet-control-attribution{background:rgba(0,0,0,.55)!important;color:#8d8a84!important;font-size:10px}
.leaflet-control-attribution a{color:#b8b4ac!important}
.leaflet-bar{border:1px solid var(--line-2)!important;box-shadow:none!important;border-radius:999px!important;overflow:hidden}
.leaflet-bar a{background:var(--glass)!important;color:var(--fg)!important;border-bottom:1px solid var(--line)!important;width:36px!important;height:36px!important;line-height:36px!important}
.leaflet-bar a:last-child{border-bottom:0!important}
.bm-icon{background:none;border:0}
.bm{position:absolute;left:0;top:0;transform:translate(-17px,-17px);display:flex;align-items:center;gap:9px;text-decoration:none;white-space:nowrap}
.bm .c{width:34px;height:34px;border-radius:50%;background:var(--venta);color:#fff;display:grid;place-items:center;font-size:13px;font-weight:700;box-shadow:0 0 0 2px rgba(255,255,255,.9),0 4px 12px rgba(0,0,0,.55);flex:none;font-variant-numeric:tabular-nums;transition:transform .2s}
.bm .l{font-family:var(--f-display);font-style:italic;font-size:17px;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.9),0 0 12px rgba(0,0,0,.8);transition:opacity .2s}
.bm.sin-tag .l{opacity:0}
.bm.grupo .c{width:40px;height:40px;font-size:14px;box-shadow:0 0 0 2px rgba(255,255,255,.9),0 0 0 7px rgba(227,20,30,.35),0 4px 12px rgba(0,0,0,.55)}
.bm.grupo{transform:translate(-20px,-20px)}
.bm.izq{flex-direction:row-reverse;transform:translate(calc(17px - 100%),-17px)}
.bm.grupo.izq{transform:translate(calc(20px - 100%),-20px)}
.bm:hover .c,.bm.on .c{transform:scale(1.15)}
@media (hover:hover){.bm:hover .l{opacity:1}}
/* Secciones: título que se desliza (Propiedades ↔ Desarrollos) */
.secciones{display:grid;gap:10px;min-width:0}
.pista-t{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch}
.pista-t::-webkit-scrollbar{display:none}
.pista-t>*{flex:0 0 100%;scroll-snap-align:start;scroll-snap-stop:always;cursor:grab}
.pestanas{display:flex;gap:18px}
.pestanas button{background:none;border:0;padding:0 0 6px;font-size:11px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);cursor:pointer;position:relative}
.pestanas button[aria-selected="true"]{color:var(--fg)}
.pestanas button[aria-selected="true"]::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:var(--venta)}
.pestanas button.dev[aria-selected="true"]::after{background:var(--champ)}
.pestanas .n{color:var(--champ);margin-left:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line-2);background:transparent;border-radius:999px;padding:6px 13px;font-size:12.5px;font-weight:600;color:var(--muted);cursor:pointer}
.chip:hover{color:var(--fg);border-color:var(--fg)}
.chip[aria-pressed="true"]{background:var(--fg);border-color:var(--fg);color:var(--ink)}
.chip svg{width:14px;height:14px}
/* tarjetas de desarrollo: grandes, foto arriba */
.dc{display:grid;gap:10px;text-decoration:none;border-radius:8px;padding:8px;margin:-8px;transition:background .15s}
.dc:hover,.dc.on{background:var(--raise)}
.dc .media{display:block;position:relative;aspect-ratio:16/10;border-radius:6px;overflow:hidden;background:var(--raise)}
.dc .media img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .6s cubic-bezier(.2,.7,.2,1)}
.dc:hover .media img,.dc.on .media img{transform:scale(1.04)}
.dc .media::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 55%,rgba(0,0,0,.55))}
.dc .sello{position:absolute;left:10px;top:10px;z-index:1;display:inline-flex;align-items:center;gap:6px;background:rgba(10,10,10,.7);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid rgba(200,178,138,.45);color:var(--champ);padding:5px 10px;border-radius:999px;font-size:10px;font-weight:600;letter-spacing:.16em;text-transform:uppercase}
.dc .sello svg{width:13px;height:13px}
.dc .est{position:absolute;right:10px;bottom:10px;z-index:1;color:#fff;font-size:10.5px;font-weight:600;letter-spacing:.16em;text-transform:uppercase}
.dc .n{font-family:var(--f-display);font-style:italic;font-size:28px;line-height:1.02}
.dc .z{font-size:12.5px;color:var(--muted)}
.dc .r{font-size:13px;color:var(--fg)}
.dc .tx{display:grid;gap:4px}
.dc .k{font-size:10.5px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--champ)}
.pron{display:grid;gap:14px;padding:22px;border:1px solid rgba(200,178,138,.35);border-radius:10px;background:linear-gradient(160deg,rgba(200,178,138,.10),transparent 60%)}
.pron b{font-family:var(--f-display);font-style:italic;font-weight:500;font-size:30px;line-height:1}
.pron p{margin:0;color:var(--muted);font-size:14px}
.b-wa{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--fg);color:var(--ink);border-radius:999px;padding:11px 16px;font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;text-decoration:none;width:max-content}
/* pin de desarrollo: rombo champagne con ícono */
.bm.dev .c{background:var(--champ);color:#0a0a0a;border-radius:9px;transform:rotate(45deg);box-shadow:0 0 0 2px rgba(255,255,255,.9),0 0 0 7px rgba(200,178,138,.3),0 4px 12px rgba(0,0,0,.55)}
.bm.dev .c>*{transform:rotate(-45deg)}
.bm.dev .c svg{width:17px;height:17px}
.bm.dev:hover .c,.bm.dev.on .c{transform:rotate(45deg) scale(1.15)}
.bm.dev.on .c{animation:latido 1.8s ease-out infinite}
@keyframes latido{0%{box-shadow:0 0 0 2px rgba(255,255,255,.9),0 0 0 4px rgba(200,178,138,.55),0 4px 12px rgba(0,0,0,.55)}100%{box-shadow:0 0 0 2px rgba(255,255,255,.9),0 0 0 16px rgba(200,178,138,0),0 4px 12px rgba(0,0,0,.55)}}
.top,.tira{display:none}
@media (max-width:899px){
  .app{display:block;height:100%}
  .panel{display:none}
  .mapa-wrap{position:fixed;inset:0}
  .leaflet-control-zoom{display:none}
  .top{display:flex;flex-direction:column;align-items:center;position:absolute;z-index:600;left:0;right:0;top:0;padding-top:calc(18px + env(safe-area-inset-top,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));pointer-events:none;text-shadow:0 1px 2px rgba(0,0,0,.85),0 0 18px rgba(0,0,0,.6)}
  .top .idiomas{position:absolute;right:max(10px,env(safe-area-inset-right,0px));top:calc(10px + env(safe-area-inset-top,0px));pointer-events:auto}
  .top .idiomas button{color:rgba(255,255,255,.6);font-size:10px;padding:6px 4px}
  .top .idiomas button[aria-pressed="true"]{color:#fff}
  .top img{height:15px;width:auto;margin-top:14px;filter:drop-shadow(0 1px 3px rgba(0,0,0,.8))}
  .top h2{font-family:var(--f-display);font-style:italic;font-weight:500;font-size:28px;line-height:1.05;margin:12px 0 0;color:#fff;text-align:center;text-wrap:balance}
  .top .pista-t{pointer-events:auto;width:100%;margin-top:4px;touch-action:pan-x}
  .top .pista-t>h2{flex:0 0 100%;padding-bottom:14px;position:relative}
  .top .pista-t>h2::after{content:"";position:absolute;left:50%;bottom:0;width:72px;height:1px;margin-left:-36px;background:rgba(255,255,255,.85)}
  .top .pista-t>h2:nth-child(2)::after{background:var(--champ)}
  .puntos-t{display:flex;gap:16px;margin-top:10px;pointer-events:auto}
  .puntos-t button{background:none;border:0;padding:4px 2px 8px;font-size:10px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:rgba(255,255,255,.55);position:relative;cursor:pointer;text-shadow:inherit}
  .puntos-t button[aria-selected="true"]{color:#fff}
  .puntos-t button::after{content:"";position:absolute;left:50%;bottom:0;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--venta);transform:scale(0);transition:transform .2s}
  .puntos-t button.dev::after{background:var(--champ)}
  .puntos-t button[aria-selected="true"]::after{transform:scale(1)}
  .top .chips{pointer-events:auto;flex-wrap:nowrap;gap:14px;margin-top:2px}
  .top .chip{background:none;border:0;border-radius:0;padding:4px 2px;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:rgba(255,255,255,.5)}
  .top .chip[aria-pressed="true"]{background:none;color:var(--champ)}
  .top .chip svg{display:none}
  .tira .dc{margin:0;background:rgba(10,10,10,.9);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(200,178,138,.4);border-radius:14px;padding:8px;grid-template-columns:118px 1fr;gap:12px;align-items:center;box-shadow:0 14px 40px rgba(0,0,0,.5)}
  .tira .dc .media{aspect-ratio:auto;height:96px;border-radius:9px}
  .tira .dc .media::after,.tira .dc .est{display:none}
  .tira .dc .sello{left:6px;top:6px;padding:3px 6px;font-size:0;gap:0}
  .tira .dc .tx{display:grid;gap:3px;min-width:0}
  .tira .dc .n{font-size:22px}
  .tira .dc .k{font-size:9.5px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--champ)}
  .tira .pron{background:rgba(10,10,10,.9);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);padding:16px;gap:10px}
  .tira .pron b{font-size:24px}.tira .pron p{font-size:13px}
  .tira li.ancho{flex-basis:calc(100% - 4px);max-width:420px}
  .bm{flex-direction:column;gap:5px;transform:translate(-50%,-17px)}
  .bm.grupo{transform:translate(-50%,-20px)}
  .bm .l{font-size:15px}
  .tira{display:flex;gap:10px;position:absolute;z-index:620;left:0;right:0;bottom:calc(18px + env(safe-area-inset-bottom,0px));overflow-x:auto;scroll-snap-type:x mandatory;padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));scrollbar-width:none;margin:0;list-style:none}
  .tira::-webkit-scrollbar{display:none}
  .tira li{flex:0 0 78%;max-width:320px;scroll-snap-align:center}
  .tira .bc{margin:0;background:rgba(10,10,10,.88);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--line-2);border-radius:14px;padding:8px;grid-template-columns:92px 1fr;gap:12px;box-shadow:0 14px 40px rgba(0,0,0,.5)}
  .tira .bc img{width:92px;height:72px;border-radius:9px}
  .tira .bc .n{font-size:20px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<!--CUERPO-->
<div class="app">
  <aside class="panel">
    <header class="head">
      <div class="barra-sup"><div class="idiomas" id="idiomas-p"></div></div>
      <div class="logo-wrap"><img class="logo" src="assets/logo-apilado.png" alt="Coldwell Banker Zetaté" width="220" height="46"></div>
      <div class="secciones">
        <div class="pestanas" id="pestanas-p" role="tablist"></div>
        <div class="pista-t" id="pista-p"><h1></h1><h1></h1></div>
      </div>
      <div class="chips" id="chips-p" hidden></div>
      <p class="bajada" id="bajada"></p>
      <div class="stats" id="stats"></div>
    </header>
    <ul class="lista" id="lista"></ul>
    <div class="pie" id="pie"></div>
  </aside>
  <main class="mapa-wrap">
    <div id="mapa" aria-label="Mapa satelital de la zona"></div>
    <div class="top"><div class="idiomas" id="idiomas-m"></div><img src="assets/logo-horizontal.png" alt="Coldwell Banker Zetaté" width="138" height="15"><div class="pista-t" id="pista-m"><h2></h2><h2></h2></div><div class="puntos-t" id="puntos-m" role="tablist"></div><div class="chips" id="chips-m" hidden></div></div>
    <ul class="tira" id="tira"></ul>
  </main>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
/*__COMUN__*/
</script>
<script>
const DATOS = /*__DATOS__*/null;
const B = DATOS.barrios, D = DATOS.desarrollos || [];
cargarEstadisticas(DATOS.sitio);
const $ = id => document.getElementById(id);
const mapa = mapaBase("mapa");
const capa = L.layerGroup().addTo(mapa);
let items = [];
/* Dos secciones: 0 = propiedades por barrio, 1 = desarrollos (edificios y barrios que se venden por lotes) */
let SECCION = location.hash === "#desarrollos" ? 1 : 0;
let FCLASE = null; /* filtro de desarrollos: null | "edificio" | "barrio" */
const lista = () => SECCION ? D.filter(d => !FCLASE || d.clase === FCLASE) : B;

function card(b) {
  return `<a class="bc" href="${b.slug}/" data-slug="${b.slug}">${b.foto ? `<img src="${esc(b.foto)}" alt="" loading="lazy">` : `<img alt="">`}
    <span class="tx"><span class="n">${esc(b.nombre)}</span>
    <span class="z">${b.total} ${b.total === 1 ? t("propiedad") : t("propiedades_m")}${b.desde_venta ? ` · ${t("desde")} U$S ${corto(b.desde_venta)}` : ""}</span>
    <span class="ops">${b.ops.map(o => `<span><i class="${o}"></i>${t(o)}</span>`).join("")}</span></span></a>`;
}
function cardDev(d) {
  const est = [tl(d.estado), d.entrega ? `${t("entrega")} ${d.entrega}` : ""].filter(Boolean).join(" · ");
  return `<a class="dc" href="desarrollos/${d.slug}/" data-slug="${d.slug}">
    <span class="media">${d.foto ? `<img src="${esc(d.foto)}" alt="" loading="lazy">` : ""}<span class="sello">${iconoDev(d)}${esc(claseDev(d))}</span>${est ? `<span class="est">${esc(est)}</span>` : ""}</span>
    <span class="tx">${movil() ? `<span class="k">${esc(claseDev(d))}${tl(d.estado) ? " · " + esc(tl(d.estado)) : ""}</span>` : ""}<span class="n">${esc(d.nombre)}</span>
    <span class="z">${esc(d.zona)}</span>${resumenDev(d) ? `<span class="r">${esc(resumenDev(d))}</span>` : ""}</span></a>`;
}
const waGeneral = () => `https://wa.me/${DATOS.sitio.whatsapp_general}?text=${encodeURIComponent(t("msg_devs"))}`;
const htmlPron = () => `<div class="pron"><b>${t("proximamente")}</b><p>${t("proximamente_b")}</p><a class="b-wa" href="${esc(waGeneral())}" target="_blank" rel="noopener">${ICONO_WA}WhatsApp</a></div>`;

function pintarSecciones() {
  const tit = [t("portada_t"), t("desarrollos")];
  document.querySelectorAll(".pista-t").forEach(pt => [...pt.children].forEach((h, k) => h.textContent = tit[k]));
  $("pestanas-p").innerHTML = [t("propiedades"), t("desarrollos")].map((x, k) =>
    `<button type="button" role="tab" class="${k ? "dev" : ""}" aria-selected="${SECCION === k}" data-k="${k}">${x}${k && D.length ? `<span class="n">${D.length}</span>` : ""}</button>`).join("");
  $("puntos-m").innerHTML = [t("propiedades"), t("desarrollos")].map((x, k) =>
    `<button type="button" role="tab" class="${k ? "dev" : ""}" aria-selected="${SECCION === k}" data-k="${k}">${x}</button>`).join("");
  document.querySelectorAll("#pestanas-p button,#puntos-m button").forEach(b => b.onclick = () => irA(+b.dataset.k, true));
}
function pintarChips() {
  const hay = SECCION && D.some(d => d.clase === "edificio") && D.some(d => d.clase === "barrio");
  for (const id of ["chips-p", "chips-m"]) {
    $(id).hidden = !hay;
    $(id).innerHTML = hay ? [[null, t("todos"), ""], ["edificio", t("edificios"), ICONO_EDIF], ["barrio", t("barrios_dev"), ICONO_LOTES]].map(([k, x, ic]) =>
      `<button class="chip" type="button" aria-pressed="${FCLASE === k}" data-k="${k || ""}">${ic}${x}</button>`).join("") : "";
    $(id).querySelectorAll(".chip").forEach(b => b.onclick = () => { FCLASE = b.dataset.k || null; pintar(); encuadrar(true); track("desarrollos/filtro/" + (FCLASE || "todos")); });
  }
}
function pintar() {
  pintarSecciones(); pintarChips();
  document.body.classList.toggle("seccion-dev", !!SECCION);
  $("bajada").textContent = SECCION ? t("desarrollos_b") : t("portada_b");
  const L0 = lista();
  if (SECCION) {
    const ed = D.filter(d => d.clase === "edificio").length, ba = D.length - ed;
    $("stats").innerHTML = D.length ? `<div class="stat"><b>${D.length}</b><span>${t("desarrollos")}</span></div>` +
      (ed ? `<div class="stat"><b>${ed}</b><span>${t("edificios")}</span></div>` : "") + (ba ? `<div class="stat"><b>${ba}</b><span>${t("barrios_dev")}</span></div>` : "") : "";
    $("lista").innerHTML = L0.length ? L0.map(d => `<li>${cardDev(d)}</li>`).join("") : `<li>${htmlPron()}</li>`;
    $("tira").innerHTML = L0.length ? L0.map(d => `<li>${cardDev(d)}</li>`).join("") : `<li class="ancho">${htmlPron()}</li>`;
  } else {
    $("stats").innerHTML = `<div class="stat"><b>${DATOS.total}</b><span>${t("propiedades")}</span></div><div class="stat"><b>${B.length}</b><span>${t("barrios")}</span></div>`;
    $("lista").innerHTML = B.map(b => `<li>${card(b)}</li>`).join("");
    $("tira").innerHTML = B.map(b => `<li>${card(b)}</li>`).join("");
  }
  $("pie").textContent = t("pie");
  document.querySelectorAll(".bc,.dc").forEach(a => {
    const g = () => grupoDe[a.dataset.slug]?.pinEl();
    a.addEventListener("mouseenter", () => g()?.classList.add("on"));
    a.addEventListener("mouseleave", () => g()?.classList.remove("on"));
    a.addEventListener("click", () => track((SECCION ? "desarrollo/" : "barrio/") + a.dataset.slug));
  });
  $("tira").scrollLeft = 0;
  agrupar();
}
/* Barrios (o desarrollos) que en pantalla quedan pegados se juntan en un solo círculo;
   tocarlo acerca el mapa hasta que se separan. */
let grupoDe = {};
function agrupar() {
  capa.clearLayers(); items = []; grupoDe = {};
  const dev = !!SECCION;
  const pts = lista().map(b => ({ b, p: mapa.latLngToLayerPoint([b.lat, b.lng]) }))
    .sort((x, y) => dev ? (y.b.destacado - x.b.destacado) || (x.b.orden - y.b.orden) : y.b.total - x.b.total);
  const usados = new Set();
  for (const a of pts) {
    if (usados.has(a)) continue;
    const miembros = pts.filter(o => !usados.has(o) && a.p.distanceTo(o.p) < (movil() ? 64 : 46));
    miembros.forEach(o => usados.add(o));
    const bs = miembros.map(o => o.b), total = dev ? bs.length : bs.reduce((s, b) => s + b.total, 0);
    const solo = bs.length === 1;
    const nombre = solo || movil() ? a.b.nombre : `${a.b.nombre} +${bs.length - 1}`;
    const href = solo ? (dev ? "desarrollos/" : "") + a.b.slug + "/" : "#";
    const centro = dev && solo ? `<span>${iconoDev(a.b)}</span>` : `<span>${total}</span>`;
    const m = L.marker([a.b.lat, a.b.lng], { keyboard: false, icon: L.divIcon({ className: "bm-icon", iconSize: [0, 0],
      html: `<a class="bm${solo ? "" : " grupo"}${dev ? " dev" : ""}" href="${href}" aria-label="${esc(nombre)}"><span class="c">${centro}</span><span class="l tag">${esc(nombre)}</span></a>` }) }).addTo(capa);
    if (!solo) m.on("click", e => {
      e.originalEvent?.preventDefault();
      mapa.flyToBounds(L.latLngBounds(bs.map(b => [b.lat, b.lng])), { ...pad, maxZoom: 17, duration: .8 });
    });
    const it = { b: a.b, total: dev ? (a.b.destacado ? 1e6 : 0) + 1000 - (a.b.orden || 100) : total, m, visible: true, pinEl: () => m.getElement()?.querySelector(".bm") };
    items.push(it); bs.forEach(b => grupoDe[b.slug] = it);
  }
  marcarTira();
  requestAnimationFrame(acomodar);
}
/* Etiquetas: si se salen por la derecha van a la izquierda del círculo; se esconden si tapan otra etiqueta u otro círculo. */
function acomodar() {
  const vis = items.filter(it => it.pinEl()), W = mapa.getContainer().clientWidth, pad = 3;
  const choca = (r, q) => !(r.right + pad < q.left || r.left - pad > q.right || r.bottom + pad < q.top || r.top - pad > q.bottom);
  vis.forEach(it => it.pinEl().classList.remove("sin-tag", "izq"));
  const circulos = vis.map(it => it.pinEl().querySelector(".c").getBoundingClientRect());
  const orden = vis.map((it, k) => ({ it, k })).sort((a, b) =>
    ((b.it.pinEl().classList.contains("on") ? 1e9 : 0) + b.it.total) - ((a.it.pinEl().classList.contains("on") ? 1e9 : 0) + a.it.total));
  const puestas = movil() ? [document.querySelector(".top .pista-t").getBoundingClientRect(), $("puntos-m").getBoundingClientRect(), $("tira").getBoundingClientRect()] : [];
  for (const { it, k } of orden) {
    const el = it.pinEl();
    let r = el.querySelector(".tag").getBoundingClientRect();
    if (!movil() && r.right > W - 8) { el.classList.add("izq"); r = el.querySelector(".tag").getBoundingClientRect(); }
    if (r.left < 8 || puestas.some(q => choca(r, q)) || circulos.some((c, j) => j !== k && choca(r, c))) el.classList.add("sin-tag");
    else puestas.push(r);
  }
}
mapa.on("zoomend", agrupar);
mapa.on("moveend", () => requestAnimationFrame(acomodar));
const pad = movil() ? { paddingTopLeft: [60, 230], paddingBottomRight: [70, 200] } : { paddingTopLeft: [80, 80], paddingBottomRight: [230, 80] };
function encuadrar(volar) {
  const L0 = lista(), pts = (L0.length ? L0 : B).map(b => [b.lat, b.lng]);
  const op = { ...pad, maxZoom: L0.length === 1 ? 15 : 16 };
  volar ? mapa.flyToBounds(L.latLngBounds(pts), { ...op, duration: .9 }) : mapa.fitBounds(L.latLngBounds(pts), op);
}
/* cambiar de sección: deslizando el título, tocando las pestañas o con #desarrollos en el link */
function irA(k, mover) {
  if (mover) document.querySelectorAll(".pista-t").forEach(pt => pt.scrollTo({ left: k * pt.clientWidth, behavior: "smooth" }));
  if (k === SECCION) return;
  SECCION = k; FCLASE = null;
  try { history.replaceState(null, "", k ? "#desarrollos" : location.pathname + location.search); } catch (_) {}
  track(k ? "seccion/desarrollos" : "seccion/propiedades");
  pintar(); encuadrar(true);
}
document.querySelectorAll(".pista-t").forEach(pt => {
  let timer = null;
  pt.addEventListener("scroll", () => {
    clearTimeout(timer);
    timer = setTimeout(() => { const k = Math.round(pt.scrollLeft / pt.clientWidth); if (k !== SECCION) irA(k, false); }, 90);
  }, { passive: true });
  /* compu: arrastrar con el mouse también desliza */
  let x0 = null, s0 = 0;
  pt.addEventListener("pointerdown", e => { if (e.pointerType === "mouse") { x0 = e.clientX; s0 = pt.scrollLeft; pt.style.scrollSnapType = "none"; } });
  window.addEventListener("pointermove", e => { if (x0 != null) pt.scrollLeft = s0 - (e.clientX - x0); });
  window.addEventListener("pointerup", e => {
    if (x0 == null) return;
    const dx = e.clientX - x0; x0 = null; pt.style.scrollSnapType = "";
    const k = Math.abs(dx) > 40 ? (dx < 0 ? 1 : 0) : SECCION;
    pt.scrollTo({ left: k * pt.clientWidth, behavior: "smooth" }); irA(k, false);
  });
});
window.addEventListener("hashchange", () => irA(location.hash === "#desarrollos" ? 1 : 0, true));
for (const id of ["idiomas-p", "idiomas-m"]) armarIdiomas($(id), pintar);
pintar();
encuadrar(false);
requestAnimationFrame(() => document.querySelectorAll(".pista-t").forEach(pt => pt.scrollLeft = SECCION * pt.clientWidth));
/* celular: al deslizar la tira, el mapa resalta ese barrio o desarrollo */
const tira = $("tira");
function marcarTira() {
  if (!movil()) return;
  const t0 = $("tira"), k = Math.round(t0.scrollLeft / (t0.firstElementChild?.offsetWidth + 10 || 1));
  const on = grupoDe[lista()[k]?.slug];
  items.forEach(it => it.pinEl()?.classList.toggle("on", it === on));
}
tira.addEventListener("scroll", () => { marcarTira(); requestAnimationFrame(acomodar); }, { passive: true });
window.addEventListener("resize", () => { mapa.invalidateSize(); document.querySelectorAll(".pista-t").forEach(pt => pt.scrollLeft = SECCION * pt.clientWidth); });
</script>
