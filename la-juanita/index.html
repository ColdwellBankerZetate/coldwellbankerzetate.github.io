<style>
/* Compu: panel negro + satélite. Celular: solo satélite con capas flotantes. Un solo tema (negro). */
:root{
  --ink:#0a0a0a; --panel:#101010; --raise:#181818; --glass:rgba(12,12,12,.72);
  --line:rgba(255,255,255,.09); --line-2:rgba(255,255,255,.18);
  --fg:#f3f1ec; --muted:#9b978f; --dim:#6d6a64; --champ:#c8b28a;
  --venta:#e3141e; --temporada:#c8b28a; --alquiler:#f3f1ec;
  --f-display:"Bodoni Moda","Didot","Bodoni 72",Georgia,serif;
  --f-body:"Hanken Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--ink);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
a{color:inherit}
.app{display:grid;grid-template-columns:minmax(360px,420px) 1fr;height:100%}

/* ---------- Panel (compu) ---------- */
.panel{display:flex;flex-direction:column;min-height:0;min-width:0;background:var(--panel);border-right:1px solid var(--line)}
.head{display:grid;gap:14px;padding-block:18px 18px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:28px}
.barra-sup{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:11px;letter-spacing:.14em;text-transform:uppercase}
.volver{color:var(--muted);text-decoration:none;font-weight:600}
.volver:hover{color:var(--fg)}
.idiomas{display:flex;gap:2px}
.idiomas button{background:none;border:0;padding:4px 6px;font-size:11px;font-weight:600;letter-spacing:.14em;color:var(--dim);cursor:pointer}
.idiomas button[aria-pressed="true"]{color:var(--fg);text-decoration:underline;text-decoration-color:var(--venta);text-underline-offset:5px;text-decoration-thickness:2px}
.logo-wrap{display:flex;justify-content:center;padding-block:8px 20px;border-bottom:1px solid var(--line)}
.logo{display:block;height:44px;width:auto;max-width:100%}
.titulo{display:grid;gap:4px;margin-top:6px}
.zona{font-size:11px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:var(--champ)}
h1{font-family:var(--f-display);font-style:italic;font-weight:500;font-size:44px;line-height:1.02;letter-spacing:-.01em;margin:0;text-wrap:balance}
.bajada{margin:0;color:var(--muted);font-size:14px;max-width:46ch}
.datos-b{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--fg);margin:0;padding:0;list-style:none}
.datos-b li{display:flex;align-items:center;gap:7px}
.datos-b li::before{content:"";width:4px;height:4px;border-radius:50%;background:var(--champ)}
.stats{display:grid;grid-template-columns:auto 1fr;gap:28px;padding-top:14px;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
.stat{display:grid;gap:2px}
.stat b{font-size:20px;font-weight:600;letter-spacing:-.01em}
.stat span{font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim)}
.filtros{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line-2);background:transparent;border-radius:999px;padding:6px 13px;font-size:12.5px;font-weight:600;color:var(--muted);cursor:pointer;transition:background .15s,color .15s,border-color .15s}
.chip:hover{color:var(--fg);border-color:var(--fg)}
.chip[aria-pressed="true"]{background:var(--fg);border-color:var(--fg);color:var(--ink)}
.chip i{width:8px;height:8px;border-radius:50%;flex:none}
.chip i.venta{background:var(--venta)}.chip i.temporada{background:var(--temporada)}.chip i.alquiler{background:var(--alquiler)}
.chip i.terrenos{background:transparent;border:2px solid var(--venta);width:6px;height:6px}
.chip:focus-visible,.card:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid var(--champ);outline-offset:2px}

.lista{list-style:none;margin:0;padding-block:4px 24px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:28px;display:grid;gap:22px;overflow:auto;min-height:0;scrollbar-width:thin;scrollbar-color:var(--line-2) transparent}
.card{display:grid;gap:10px;cursor:pointer;border-radius:4px}
.card .media{position:relative;aspect-ratio:16/10;max-width:100%;overflow:hidden;border-radius:4px;background:var(--raise)}
.card .media img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .6s cubic-bezier(.2,.7,.2,1)}
.card:hover .media img,.card.on .media img{transform:scale(1.04)}
.card .marca-op{position:absolute;left:10px;top:10px;display:flex;gap:6px}
.pildora{background:var(--glass);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid var(--line);padding:4px 9px;border-radius:999px;font-size:10.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;display:inline-flex;align-items:center;gap:6px}
.pildora i{width:6px;height:6px;border-radius:50%}
.pildora i.venta{background:var(--venta)}.pildora i.temporada{background:var(--temporada)}.pildora i.alquiler{background:var(--alquiler)}
.card .fav{position:absolute;right:10px;top:10px}
.b-fav{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;border:1px solid var(--line-2);background:var(--glass);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);color:var(--fg);cursor:pointer;padding:0}
.b-fav[aria-pressed="true"]{color:var(--venta);border-color:rgba(227,20,30,.6)}
.card .fila{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.precio{font-family:var(--f-display);font-size:25px;font-weight:500;letter-spacing:-.01em;font-variant-numeric:lining-nums tabular-nums;line-height:1.05}
.otra-op{font-size:12.5px;color:var(--muted)}
.specs{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;color:var(--muted)}
.specs span+span::before{content:"";display:inline-block;width:3px;height:3px;border-radius:50%;background:var(--dim);vertical-align:3px;margin-right:14px}
.enlaces{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center}
.ver{font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;text-decoration:none;color:var(--fg);border-bottom:1px solid var(--line-2);padding-bottom:2px;white-space:nowrap}
.ver:hover{border-color:var(--fg)}
.ver.wa{display:inline-flex;align-items:center;gap:6px;border:0;color:var(--muted)}
.ver.wa:hover{color:var(--fg)}
.card.oculta{display:none}
.vacio{color:var(--muted);font-size:14px;line-height:1.6}
.pie{padding-block:12px 16px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:28px;border-top:1px solid var(--line);font-size:11px;color:var(--dim);display:grid;gap:10px}
.b-sel{display:flex;align-items:center;justify-content:center;gap:8px;background:var(--fg);color:var(--ink);border:0;border-radius:999px;padding:11px 16px;font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;text-decoration:none;cursor:pointer}
.b-sel svg{color:var(--venta)}
.b-sec{display:flex;align-items:center;justify-content:center;gap:8px;background:transparent;color:var(--fg);border:1px solid var(--line-2);border-radius:999px;padding:10px 16px;font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;text-decoration:none;cursor:pointer}
.b-sec:hover{border-color:var(--fg)}
.compartir{display:grid;gap:8px}
.compartir label{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
.compartir input{background:var(--raise);border:1px solid var(--line-2);border-radius:10px;padding:10px 12px;color:var(--fg)}
.compartir .fila-b{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.aviso{font-size:12px;color:var(--champ);min-height:1em}

/* ---------- Mapa ---------- */
.mapa-wrap{position:relative;min-width:0;min-height:0;overflow:hidden}
#mapa{position:absolute;inset:0;background:#0c0f0c}
.mapa-wrap::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:450;background:radial-gradient(120% 90% at 50% 45%,transparent 55%,rgba(0,0,0,.45) 100%)}
.leaflet-tile-pane{filter:brightness(.82) contrast(1.08) saturate(.85)}
.leaflet-container{font-family:var(--f-body);background:#0c0f0c}
.leaflet-control-attribution{background:rgba(0,0,0,.55)!important;color:#8d8a84!important;font-size:10px}
.leaflet-control-attribution a{color:#b8b4ac!important}
.leaflet-bar{border:1px solid var(--line-2)!important;box-shadow:none!important;border-radius:999px!important;overflow:hidden}
.leaflet-bar a{background:var(--glass)!important;color:var(--fg)!important;border-bottom:1px solid var(--line)!important;width:36px!important;height:36px!important;line-height:36px!important}
.leaflet-bar a:last-child{border-bottom:0!important}
.leaflet-touch .leaflet-control-zoom{margin-right:calc(16px + env(safe-area-inset-right,0px))!important;margin-bottom:calc(24px + env(safe-area-inset-bottom,0px))!important}

/* Pines: gota con punto negro; color = operación; terreno = gota con aro */
.pin-icon{background:none;border:0}
.pin{--c:var(--venta);position:absolute;left:0;top:0;display:flex;align-items:center;gap:8px;text-decoration:none;white-space:nowrap;transform:translate(-11px,-27px);transition:opacity .25s;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.pin.temporada{--c:var(--temporada)}.pin.alquiler{--c:var(--alquiler)}
.pin .dot{position:relative;width:22px;height:27px;flex:none;transform-origin:50% 100%;transition:transform .2s}
.pin .dot::before{content:"";position:absolute;left:0;top:0;width:22px;height:22px;background:var(--c);border-radius:50% 50% 50% 0;transform:rotate(-45deg);box-shadow:0 0 0 1.5px rgba(255,255,255,.9),-2px 4px 10px rgba(0,0,0,.55)}
.pin .dot::after{content:"";position:absolute;left:7px;top:7px;width:8px;height:8px;border-radius:50%;background:#0a0a0a}
.pin.es-terreno .dot::after{background:transparent;border:2.5px solid #0a0a0a;left:5.5px;top:5.5px;width:6px;height:6px}
.pin::before{content:"";position:absolute;left:-3px;top:21px;width:28px;height:12px;border-radius:50%;border:1.5px solid var(--c);opacity:0;transform:scale(.4)}
.pin.on::before{animation:ping 1.6s ease-out infinite}

.pin .tag{display:grid;line-height:1.1;gap:2px;background:rgba(10,10,10,.86);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);color:#f3f1ec;border:1px solid rgba(255,255,255,.14);border-radius:6px;padding:6px 10px;box-shadow:0 6px 18px rgba(0,0,0,.45);font-variant-numeric:tabular-nums;transition:background .2s,color .2s,transform .2s,opacity .2s;transform-origin:left center}

.carr .pista-f{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;touch-action:pan-x;overscroll-behavior-x:contain}
.carr .pista-f::-webkit-scrollbar{display:none}
.carr img{flex:0 0 100%;width:100%;aspect-ratio:4/3;object-fit:cover;scroll-snap-align:start;display:block}

.agenda .cal{margin-top:10px;font-variant-numeric:tabular-nums}

.tabla-disp tr.oc td:first-child,.tabla-disp tr.oc td:nth-child(2){color:var(--dim);text-decoration:line-through}

.b-agenda{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;font:inherit;font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;cursor:pointer;background:var(--champ);color:var(--ink);border:0;border-radius:8px;padding:11px 10px;transition:filter .2s}

.cal-pie{display:grid;gap:4px;margin-top:7px;font-size:11.5px}
.cal-res{color:var(--champ)}
.cal-ley{display:flex;align-items:center;gap:5px;color:var(--muted);font-size:10.5px}

.cal-ley i.li{background:rgba(255,255,255,.18)}.cal-ley i.oc,.cal-ley i.st{background:rgba(227,20,30,.45);margin-left:6px}.cal-ley i.st{background:none;box-shadow:inset 0 0 0 1px var(--line-2)}

.prev .b-ficha{background:var(--fg);color:var(--ink)}
.prev .b-wa{border:1px solid var(--line-2);color:var(--fg)}
.prev .b-wa:hover{border-color:var(--fg)}
.prev .b-fav{width:36px;height:36px;border-radius:8px;background:transparent}

/* Comparador */
.comp{position:fixed;inset:0;z-index:2000;background:rgba(5,5,5,.96);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.comp header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:16px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line)}

  .abajo{display:flex;justify-content:center;gap:8px;position:absolute;z-index:620;left:0;right:0;bottom:calc(22px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));pointer-events:none}

}

const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const fmt = n => Math.round(n).toLocaleString(LANG === "en" ? "en-US" : (LANG === "pt" ? "pt-BR" : "es-UY"));

  if (o.precio == null) return t("consultar_precio"); /* temporada marcada en la planilla, sin tarifa en Tokko */
  const base = `${mon(o.moneda)} ${fmt(o.precio)}`;
  if (o.tipo === "venta") return base;
  const u = o.unidad ? ` / ${t(o.unidad)}` : "";
  return (o.tipo === "temporada" && conDesde ? t("desde") + " " : "") + base + u;

/* --- etiquetas sin superponerse --- */
function acomodarEtiquetas(items, prioridad) {
  const vis = items.filter(it => it.visible && it.pinEl());
  vis.forEach(it => it.pinEl().classList.remove("sin-tag"));
  const medidas = vis.map(it => ({ it, r: it.pinEl().querySelector(".tag").getBoundingClientRect() }));
  medidas.sort((a, b) => prioridad(b.it) - prioridad(a.it));
  const puestas = [];
  for (const m of medidas) {
    const r = m.r, pad = 3;
    const choca = puestas.some(q => !(r.right + pad < q.left || r.left - pad > q.right || r.bottom + pad < q.top || r.top - pad > q.bottom));
    if (choca) m.it.pinEl().classList.add("sin-tag"); else puestas.push(r);
  }
}

/* --- agenda de disponibilidad ---

function posiciones(lista) {
  const g = {};
  lista.forEach(p => (g[p.lat.toFixed(5) + "," + p.lng.toFixed(5)] ||= []).push(p));
  const pos = new Map();
  Object.values(g).forEach(gr => gr.forEach((p, k) => {

  return pos;
}

  const dorms = [...new Set(P.filter(p => p.tipo !== "terreno" && p.dormitorios && (!filtro.op || coincideOp(p))).map(p => p.dormitorios))].sort((a, b) => a - b);
  if (filtro.dorm && !dorms.includes(filtro.dorm)) filtro.dorm = null;
  for (const [idO, idD] of [["f-op-p", "f-dorm-p"], ["f-op-m", "f-dorm-m"]]) {
    $(idO).innerHTML = opciones.length > 2 ? opciones.map(o => `<button class="chip" type="button" data-op="${o.k || ""}" aria-pressed="${filtro.op === o.k}">${o.k ? `<i class="${o.k}"></i>` : ""}${esc(o.t)}</button>`).join("") : "";
    $(idD).innerHTML = dorms.length > 1 && filtro.op !== "terrenos" ? dorms.map(d => `<button class="chip" type="button" data-d="${d}" aria-pressed="${filtro.dorm === d}">${d} ${t("dorm")}</button>`).join("") : "";
    $(idO).querySelectorAll(".chip").forEach(b => b.addEventListener("click", () => { filtro.op = b.dataset.op || null; aplicar(true); }));
    $(idD).querySelectorAll(".chip").forEach(b => b.addEventListener("click", () => { const d = +b.dataset.d; filtro.dorm = filtro.dorm === d ? null : d; aplicar(true); }));
  }
}
function coincideOp(p) { const f = filtro.dorm; filtro.dorm = null; const r = coincide(p); filtro.dorm = f; return r; }

/* ---------- pines y lista ---------- */
function marcar(i, on) {
  const it = items[i]; if (!it) return;
  it.card?.classList.toggle("on", on);
  it.pinEl()?.classList.toggle("on", on);
  it.m.setZIndexOffset(on ? 1000 : 0);
}
function seleccionar(i) { if (actual != null && actual !== i) marcar(actual, false); actual = i; if (i != null) marcar(i, true); }
function abrirVista(i) {
  clearTimeout(timerCierre);
  if (abiertaDe === i && mapa.hasLayer(vista)) return;
  const it = items[i]; seleccionar(i);
  vista.setLatLng(it.m.getLatLng()).setContent(htmlVista(it.p, filtroOp())).openOn(mapa);
  abiertaDe = i;
  const c = vista.getElement(); armarVista(c, it.p);
  c.addEventListener("crece", () => vista._adjustPan()); /* la agenda la agranda: reacomodar el mapa */
  c.onmouseenter = () => clearTimeout(timerCierre);
  c.onmouseleave = () => { if (!tactil) cerrarLuego(); };
  $("abajo").querySelector(".ayuda")?.classList.add("fuera");
  track("ver/" + it.p.ref);
}
function cerrarLuego() { clearTimeout(timerCierre); timerCierre = setTimeout(() => mapa.closePopup(vista), 300); }
mapa.on("popupclose", e => { if (e.popup === vista) { abiertaDe = null; seleccionar(null); } });

function htmlCard(p) {
  const o = opPrincipal(p, filtroOp());
  const otras = p.ops.filter(x => x !== o);
  const fav = FAV.tiene(p.ref);
  return `<div class="media">${p.fotos[0] ? `<img src="${esc(p.fotos[0])}" alt="" loading="lazy">` : ""}
      <div class="marca-op">${p.ops.map(x => `<span class="pildora"><i class="${x.tipo}"></i>${t(x.tipo)}</span>`).join("")}</div>
      <div class="fav"><button class="b-fav" type="button" aria-pressed="${fav}" title="${fav ? t("guardada") : t("guardar")}">${ICONO_CORAZON}</button></div></div>
    <div class="fila"><span class="precio">${esc(precioOp(o))}</span></div>
    ${otras.map(x => `<span class="otra-op">${t(x.tipo)} · ${esc(precioOp(x))}</span>`).join("")}
    <div class="specs">${specs(p)}${SEL ? `<span>${esc(p.barrio_nombre)}</span>` : (p.lote ? `<span>${t("lote")} ${esc(p.lote)}</span>` : "")}</div>
    ${tieneAgenda(p) ? htmlBotonAgenda() + `<div class="agenda" hidden><div class="per"></div><div class="cal"></div></div>` : ""}
    <div class="enlaces"><a class="ver" href="${esc(p.url)}" target="_blank" rel="noopener">${t("ver_ficha")} ↗</a>
      <a class="ver wa" href="${esc(linkWA(p))}" target="_blank" rel="noopener">${ICONO_WA}${t("consultar")}</a>
      ${SEL ? `<button class="ver" type="button" data-quitar style="background:none;border:0;border-bottom:1px solid var(--line-2);cursor:pointer;color:var(--muted)">${t("quitar")}</button>` : ""}</div>
    `;
}

function construir() {
  capaPins.clearLayers(); $("lista").innerHTML = ""; items = []; actual = null; abiertaDe = null;
  const pos = posiciones(P);
  P.forEach((p, i) => {
    const icono = L.divIcon({ className: "pin-icon", iconSize: [0, 0], html: htmlPin(p, filtroOp()) });
    const m = L.marker(pos.get(p.ref), { icon: icono, keyboard: false }).addTo(capaPins);
    const li = document.createElement("li"); li.className = "card"; li.tabIndex = 0; li.innerHTML = htmlCard(p);
    $("lista").appendChild(li);
    const it = { p, m, card: li, visible: true, pinEl: () => m.getElement()?.querySelector(".pin") };
    items.push(it);
    li.querySelector(".b-fav").addEventListener("click", e => { e.stopPropagation(); FAV.alternar(p.ref); });
    li.querySelectorAll("a").forEach(a => a.addEventListener("click", e => { e.stopPropagation(); track((a.classList.contains("wa") ? "whatsapp/" : "ficha/") + p.ref); }));
    engancharAgenda(li.querySelector(".b-agenda"), li.querySelector(".agenda"), p);
    li.querySelector("[data-quitar]")?.addEventListener("click", e => { e.stopPropagation(); quitarDeSeleccion(p.ref); });
    engancharPin(it, i); engancharCard(it, i);
  });
}
function engancharPin(it, i) {
  const el = it.m.getElement();
  el.addEventListener("mouseenter", () => { if (!tactil) abrirVista(i); });
  el.addEventListener("mouseleave", () => { if (!tactil) cerrarLuego(); });
  let timerLargo = null, largo = false, x0 = 0, y0 = 0;
  el.addEventListener("touchstart", e => {
    largo = false; const q = e.touches[0]; x0 = q.clientX; y0 = q.clientY; clearTimeout(timerLargo);
    timerLargo = setTimeout(() => { largo = true; try { navigator.vibrate && navigator.vibrate(12); } catch (_) {} abrirVista(i); }, 420);
  }, { passive: true });
  el.addEventListener("touchmove", e => { const q = e.touches[0]; if (Math.hypot(q.clientX - x0, q.clientY - y0) > 10) clearTimeout(timerLargo); }, { passive: true });
  el.addEventListener("touchend", e => { clearTimeout(timerLargo); if (largo) e.preventDefault(); });
  el.addEventListener("contextmenu", e => e.preventDefault());
  el.addEventListener("click", e => { if (largo) { e.preventDefault(); largo = false; return; } track("ficha/" + it.p.ref); });
}
function engancharCard(it, i) {
  it.card.addEventListener("mouseenter", () => { if (abiertaDe == null) seleccionar(i); });
  it.card.addEventListener("mouseleave", () => { if (abiertaDe == null && actual === i) seleccionar(null); });
  const ir = () => { mapa.closePopup(vista); seleccionar(i); mapa.flyTo(it.m.getLatLng(), Math.max(mapa.getZoom(), 17.5), { duration: 0.9 }); mapa.once("moveend", () => abrirVista(i)); };
  it.card.addEventListener("click", e => { if (!e.target.closest("a,button")) ir(); });
  it.card.addEventListener("keydown", e => { if (e.key === "Enter" && !e.target.closest("a,button")) ir(); });
}

function acomodar() { acomodarEtiquetas(items, it => (it === items[actual] ? 1e12 : 0) + (it.p.ops[0].tipo === "venta" ? 1e9 : 0) + (it.p.ops[0].precio || 0)); }
mapa.on("zoomend moveend", () => requestAnimationFrame(acomodar));

function aplicar(reencuadrar) {
  pintarFiltros();
  const fo = filtroOp(), vis = [];
  items.forEach(it => {
    const ok = coincide(it.p); it.visible = ok;
    it.m.setIcon(L.divIcon({ className: "pin-icon", iconSize: [0, 0], html: htmlPin(it.p, fo) }));
    it.pinEl()?.classList.toggle("apagado", !ok);
    it.card.classList.toggle("oculta", !ok);
    if (ok) vis.push(it);
    engancharPin(it, items.indexOf(it));
  });
  const sc = $("st-cant"); if (sc) sc.textContent = vis.length;
  mapa.closePopup(vista);
  const cerca = vis.filter(it => !it.p.lejos);
  if (reencuadrar && vis.length) encuadrar((cerca.length ? cerca : vis).map(it => it.m.getLatLng()));
  requestAnimationFrame(acomodar);
}
function encuadrar(latlngs) {
  if (!latlngs.length) return;
  const pad = movil() ? { paddingTopLeft: [30, 200], paddingBottomRight: [140, 90] } : { paddingTopLeft: [70, 70], paddingBottomRight: [200, 70] };
  mapa.fitBounds(L.latLngBounds(latlngs), { ...pad, maxZoom: 17 });
}

/* ---------- puntos del barrio ---------- */
function pintarPuntos() {
  capaPuntos.clearLayers();
  (DATOS.puntos || []).forEach(pt => L.marker([pt.lat, pt.lng], { interactive: false, keyboard: false,
    icon: L.divIcon({ className: "punto-icon", iconSize: [0, 0], html: `<span class="punto"><i></i><span>${esc(tl(pt.nombre))}</span></span>` }) }).addTo(capaPuntos));
}

/* ---------- selección ---------- */
function pintarAcciones() {
  const n = FAV.lista().length;
  const ab = $("abajo"), ac = $("acciones-p");
  if (SEL) {
    ac.innerHTML = P.length ? `<div class="compartir">
        <button class="b-sec" type="button" id="b-comp">${t("comparar")} (${P.length})</button>
        <label for="in-para">${t("para")}</label><input id="in-para" type="text" placeholder="${esc(t("para_ph"))}" value="${esc(PARA)}">
        <div class="fila-b"><button class="b-sec" type="button" id="b-copiar">${t("copiar")}</button><a class="b-sel" id="b-wa-sel" target="_blank" rel="noopener">${ICONO_WA}WhatsApp</a></div>
        <span class="aviso" id="aviso"></span></div>` : "";
    ab.innerHTML = P.length ? `<button class="b-sec" type="button" id="b-comp-m">${t("comparar")}</button><button class="b-sel" type="button" id="b-comp-sh">${t("compartir")}</button>` : "";
    if (P.length) {
      $("b-comp").onclick = abrirComparador; $("b-comp-m").onclick = abrirComparador;
      $("b-comp-sh").onclick = abrirHojaCompartir;
      enlazarCompartir($("in-para"), $("b-copiar"), $("b-wa-sel"), $("aviso"));
    }
    return;
  }
  ac.innerHTML = n ? `<a class="b-sel" href="${esc(urlSeleccion(FAV.lista()))}">${ICONO_CORAZON}${t("mi_seleccion")} (${n})</a>` : "";
  ab.innerHTML = n ? `<a class="b-sel" href="${esc(urlSeleccion(FAV.lista()))}">${ICONO_CORAZON}${t("mi_seleccion")} (${n})</a>`
    : (tactil ? `<div class="ayuda${abiertaDe != null ? " fuera" : ""}">${t("mantener")}</div>` : "");
}
function enlazarCompartir(input, bCopiar, aWA, aviso) {
  const refs = () => P.map(p => p.ref);
  const act = () => {
    PARA = input.value.trim();
    const u = urlSeleccion(refs(), PARA);
    aWA.href = `https://wa.me/?text=${encodeURIComponent(TXT[LANG].msg_sel(PARA, u))}`;
    try { history.replaceState(null, "", u); } catch (_) {}
    pintarTextos();
  };
  input.addEventListener("input", act); act();
  bCopiar.addEventListener("click", () => {
    const u = urlSeleccion(refs(), PARA);
    const ok = () => { aviso.textContent = t("copiado"); track("seleccion/copiar"); };
    (navigator.clipboard?.writeText(u) || Promise.reject()).then(ok).catch(() => { input.value = u; input.select(); aviso.textContent = u; });
  });
  aWA.addEventListener("click", () => track("seleccion/whatsapp"));
}
function abrirHojaCompartir() {
  const h = $("hoja-comp");
  h.innerHTML = `<div class="compartir"><label for="in-para-m">${t("para")}</label><input id="in-para-m" type="text" placeholder="${esc(t("para_ph"))}" value="${esc(PARA)}">
    <div class="fila-b"><button class="b-sec" type="button" id="b-copiar-m">${t("copiar")}</button><a class="b-sel" id="b-wa-m" target="_blank" rel="noopener">${ICONO_WA}WhatsApp</a></div>
    <span class="aviso" id="aviso-m"></span><button class="b-sec" type="button" id="b-cerrar-h">${t("cerrar")}</button></div>`;
  h.hidden = false;
  enlazarCompartir($("in-para-m"), $("b-copiar-m"), $("b-wa-m"), $("aviso-m"));
  $("b-cerrar-h").onclick = () => { h.hidden = true; };
}
function quitarDeSeleccion(ref) {
  P = P.filter(p => p.ref !== ref); FAV.quitar(ref);
  construir(); pintarTextos(); aplicar(true); pintarAcciones();
  const u = urlSeleccion(P.map(p => p.ref), PARA); try { history.replaceState(null, "", u); } catch (_) {}
}
function abrirComparador() {
  const c = $("comp");
  const fila = (n, f) => `<tr><th>${n}</th>${P.map(p => `<td>${f(p)}</td>`).join("")}</tr>`;
  c.innerHTML = `<header><h2>${t("comparar")}</h2><button class="b-sec" type="button" id="cerrar-comp">${t("cerrar")}</button></header>
    <div class="scroll"><table>
      ${fila("", p => p.fotos[0] ? `<img src="${esc(p.fotos[0])}" alt="">` : "")}
      ${fila(t("barrio"), p => esc(p.barrio_nombre) + (p.lote ? ` · ${t("lote")} ${esc(p.lote)}` : ""))}
      ${fila(t("precio"), p => p.ops.map((o, k) => k ? `<span class="otra-op">${t(o.tipo)} · ${esc(precioOp(o))}</span>` : `<span class="precio">${esc(precioOp(o))}</span>`).join(""))}
      ${fila(t("dormitorios"), p => p.tipo === "terreno" ? "—" : (p.dormitorios ?? "—"))}
      ${fila(t("banos"), p => mitad(p.banos) ?? "—")}
      ${fila(t("superficie"), p => p.m2_cubiertos ? fmt(p.m2_cubiertos) + " m²" : "—")}
      ${fila(t("terreno_m2"), p => p.m2_terreno ? fmt(p.m2_terreno) + " m²" : "—")}
      ${fila(t("agente"), p => esc(p.agente.nombre))}
      ${fila("", p => `<a class="ver" href="${esc(p.url)}" target="_blank" rel="noopener">${t("ver_ficha")} ↗</a>`)}
    </table></div>`;
  c.hidden = false; track("seleccion/comparar");
  $("cerrar-comp").onclick = () => { c.hidden = true; };
}
document.addEventListener("fav", () => {
  pintarAcciones();
  items.forEach(it => { const b = it.card.querySelector(".b-fav"); const on = FAV.tiene(it.p.ref); b.setAttribute("aria-pressed", String(on)); b.title = on ? t("guardada") : t("guardar"); });
});

/* ---------- arranque ---------- */
function todo(reencuadrar) {
  pintarTextos(); construir(); pintarPuntos(); aplicar(reencuadrar); pintarAcciones();
}
for (const id of ["idiomas-p", "idiomas-m"]) armarIdiomas($(id), () => todo(false));
async function iniciar() {
  if (SEL) {
    const refs = (Q.get("p") || "").split(",").filter(Boolean);
    const lista = refs.length ? refs : FAV.lista();
    try {
      const d = await (await fetch(DATOS.raiz + "datos.json", { cache: "no-cache" })).json();
      const idx = new Map(d.propiedades.map(p => [p.ref, p]));
      P = lista.map(r => idx.get(r)).filter(Boolean);
    } catch (_) { P = []; }
  }
  todo(true);
  if (!P.length) mapa.setView([-34.86, -54.75], 11);
}
iniciar();
window.addEventListener("resize", () => { mapa.invalidateSize(); requestAnimationFrame(acomodar); });
</script>
